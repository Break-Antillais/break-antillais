<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="icon" type="image/png" href="app-icon.png"/>
<link rel="shortcut icon" type="image/png" href="app-icon.png"/>
<link rel="apple-touch-icon" href="app-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<meta name="mobile-web-app-capable" content="yes"/>
<title>Break Antillais</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
:root {
  --red: #C8232B;
  --red2: #E8303A;
  --gold: #D4AF37;
  --dark: #0a0a0a;
  --dark2: #111111;
  --dark3: #1a1a1a;
  --dark4: #222222;
  --text: #f0ece4;
  --muted: #777;
  --border: rgba(255,255,255,0.08);
  --border-red: rgba(200,35,43,0.25);
  --radius: 14px;
  --radius-sm: 9px;
  --head: 'Syne', sans-serif;
  --body: 'DM Sans', sans-serif;
  --script: 'Dancing Script', cursive;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--dark) !important; color: var(--text); font-family: var(--body); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
/* PWA safe area — évite que le header passe sous la barre de statut iOS */
@supports (padding-top: env(safe-area-inset-top)) {
  body { padding-top: env(safe-area-inset-top); }
}
/* ── Fond d'ecran global (sauf écran chargement) ── */
#app-bg { display: none; }
#app-overlay { display: none; }
body > *:not(#loading):not(#app-bg):not(nav):not(#m-product):not(#m-auth):not(.toast-wrap) { position:relative; z-index:1; }


@keyframes spin { to { transform: rotate(360deg); }
@keyframes flashPresence {
  0%,100% { background: var(--dark2); border-color: #f59e0b; box-shadow: 0 0 0 0 rgba(245,158,11,.7); }
  50% { background: rgba(245,158,11,.12); border-color: #fbbf24; box-shadow: 0 0 0 6px rgba(245,158,11,0); }
}
.presence-flash {
  animation: flashPresence 0.8s ease infinite !important;
  border: 2px solid #f59e0b !important;
}
@keyframes pulsePresence {
  0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); border-color: #10b981; }
  50% { box-shadow: 0 0 0 8px rgba(16,185,129,0); border-color: #34d399; }
}
.presence-alert {
  animation: pulsePresence 1.4s ease infinite;
  border: 2px solid #10b981 !important;
} }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
@keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity:1; } 100% { transform: translateY(100vh) rotate(720deg); opacity:0; } }
@keyframes confettiWiggle { 0%,100% { transform: skewX(-5deg); } 50% { transform: skewX(5deg); } }
@keyframes bounceIn { 0% { transform:scale(0); opacity:0; } 60% { transform:scale(1.2); } 80% { transform:scale(.95); } 100% { transform:scale(1); opacity:1; } }
@keyframes pointsCount { from { transform:scale(1.4); color:#D4AF37; } to { transform:scale(1); } }
@keyframes palierGlow { 0%,100% { box-shadow:0 0 15px rgba(212,175,55,.3); } 50% { box-shadow:0 0 30px rgba(212,175,55,.7); } }

/* QR */
.qr-wrap { display:flex; flex-direction:column; align-items:center; gap:1.25rem; padding:2rem 1rem 1rem; }
.qr-box { background:#fff; padding:1.2rem; border-radius:16px; box-shadow:0 8px 32px rgba(200,35,43,.25); }
.qr-box canvas { display:block !important; } .qr-box img { display:none !important; }

/* CGV */
.cgv-content { font-size:.85rem; line-height:1.7; color:rgba(240,236,228,.85); }
.cgv-content h3 { font-family:var(--head); font-size:.95rem; font-weight:800; color:#fff; margin:1.25rem 0 .4rem; }
.cgv-content p { margin-bottom:.65rem; }

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; background: #0a0a0a;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  z-index: 9999; gap: 0; overflow: hidden;
}
#loading img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; opacity: 1; }
#loading-inner { position: relative; z-index: 1; text-align: center; margin-bottom: 3rem; }
#loading-dots { display:flex; gap:.55rem; justify-content:center; opacity:0; animation: fadeIn .5s ease .4s forwards; }
.loading-dot { width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 8px rgba(200,35,43,.7); animation: dotPulse 1.2s ease-in-out infinite; }
.loading-dot:nth-child(2) { animation-delay:.2s; }
.loading-dot:nth-child(3) { animation-delay:.4s; }
@keyframes dotPulse { 0%,80%,100% { transform:scale(.6); opacity:.4; } 40% { transform:scale(1); opacity:1; } }
#loading-spinner { display:none; }

/* ── SCREENS ── */
.screen { display: none; min-height: 100vh; background: transparent; animation: fadeIn .25s ease; padding-bottom: 75px; }
@keyframes homeReveal { 0% { opacity:0; transform:scale(1.04) translateY(12px); } 100% { opacity:1; transform:scale(1) translateY(0); } }
.home-reveal { animation: homeReveal .55s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes flameWiggle { 0%,100% { transform: rotate(-8deg) scale(1); } 25% { transform: rotate(8deg) scale(1.1); } 50% { transform: rotate(-5deg) scale(.95); } 75% { transform: rotate(5deg) scale(1.05); } }
.flame-anim { display:inline-block; animation: flameWiggle .6s ease-in-out infinite; }
@keyframes badgePulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
.status-preparing-anim { animation: badgePulse 1.5s ease infinite; }
.screen.active { display: block; }

/* ── HEADER ── */
.header {
  background: var(--dark2); border-bottom: 1px solid var(--border);
  padding: .7rem 1.1rem; display: flex; align-items: center; justify-content: space-between;
  padding-top: max(.7rem, env(safe-area-inset-top));
  position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
}
.logo { display: flex; align-items: center; gap: 0; line-height: 1; }
.logo-break { font-family: var(--head); font-weight: 800; font-size: 1.25rem; color: #fff; letter-spacing: -.02em; }
.logo-antillais { font-family: var(--script); font-weight: 700; font-size: 1.15rem; color: var(--red); margin-left: .18rem; }

/* ── BOTTOM NAV ── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--dark2); border-top: 1px solid var(--border);
  display: flex; z-index: 9999; padding-bottom: env(safe-area-inset-bottom);
  transform: translateZ(0); -webkit-transform: translateZ(0);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: .6rem .4rem; border: none; background: none;
  color: var(--muted); font-family: var(--body); font-size: .62rem;
  font-weight: 600; gap: .22rem; cursor: pointer; transition: color .2s;
  position: relative; letter-spacing: .02em; text-transform: uppercase;
}
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn.active { color: var(--red); }
.nav-badge {
  position: absolute; top: 4px; right: calc(50% - 18px);
  background: var(--red); color: #fff; font-size: .58rem; font-weight: 700;
  min-width: 15px; height: 15px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
  transition: transform .15s;
}
@keyframes badgeBounce { 0% { transform:scale(1); } 30% { transform:scale(1.7); } 60% { transform:scale(.85); } 80% { transform:scale(1.2); } 100% { transform:scale(1); } }
.badge-bounce { animation: badgeBounce .45s cubic-bezier(.36,.07,.19,.97); }
/* ── Masquer la nav pendant le chargement ── */
.nav { display: none; }
.app-ready .nav { display: flex; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: .45rem; padding: .75rem 1.4rem; border-radius: var(--radius-sm);
  border: none; cursor: pointer; font-family: var(--body);
  font-weight: 600; font-size: .88rem; transition: all .15s; text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.btn:active { opacity: .75; transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
.btn-primary { background: var(--red); color: #fff; box-shadow: 0 4px 18px rgba(200,35,43,.3); }
.btn-primary:hover { background: var(--red2); transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: rgba(255,255,255,.1); }
.btn-danger { background: #991b1b; color: #fff; }
.btn-full { width: 100%; }
.btn-sm { padding: .45rem .9rem; font-size: .8rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── FORMS ── */
.form-group { display: flex; flex-direction: column; gap: .35rem; margin-bottom: .85rem; }
.form-label { font-size: .72rem; font-weight: 700; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
.form-input, .form-select, .form-textarea {
  background: var(--dark3); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: .7rem .95rem;
  color: var(--text); font-family: var(--body); font-size: .92rem;
  width: 100%; transition: border-color .2s; outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--red); }
.form-input::placeholder { color: var(--muted); }
.form-textarea { resize: vertical; min-height: 90px; }
.form-select option { background: var(--dark3); }
.form-error { color: #f87171; font-size: .78rem; display: none; margin-top: .2rem; }
.form-error.show { display: block; }

/* ── CARD ── */
.card { background: var(--dark3); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; }

/* ── MODAL ── */
#m-product, #m-auth {
  display: none;
  position: fixed; inset: 0;
  z-index: 10040;
}
#m-auth { z-index: 10050; }
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(env(safe-area-inset-top),.5rem) .75rem calc(env(safe-area-inset-bottom) + 80px);
  box-sizing: border-box;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: fadeIn .2s ease;
}
.modal {
  background: var(--dark2); border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%; max-width: 520px;
  max-height: min(88vh, calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 90px));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
  padding: 1.4rem;
  animation: slideUp .28s ease;
  box-sizing: border-box;
  position: relative;
  flex-shrink: 0;
  width: 100%;
}
.modal-handle { width: 36px; height: 3px; background: var(--border); border-radius: 2px; margin: 0 auto 1.1rem; }
.modal-title { font-family: var(--head); font-size: 1.25rem; font-weight: 800; margin-bottom: 1.1rem; }

.modal-scroll { overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
.modal-checkout { display:flex; flex-direction:column; overflow:hidden; padding:0; }
.modal-checkout .checkout-head { padding:1rem 1.2rem .75rem; border-bottom:1px solid var(--border); flex-shrink:0; }
.modal-checkout .checkout-body { padding:1rem 1.2rem; }
.modal-checkout .checkout-foot { padding:.9rem 1.2rem; border-top:1px solid var(--border); background:var(--dark2); flex-shrink:0; }

/* Forcing modals to stay fully visible (no scroll) on small screens */
.modal-fit-no-scroll { overflow-y: auto !important; }
.modal-fit-no-scroll .modal-scroll { overflow-y: auto !important; }




/* ── CHIPS ── */
.chips { display: flex; flex-wrap: wrap; gap: .35rem; width: 100%; }
.chip {
  padding: .38rem .8rem; border: 1.5px solid var(--border);
  border-radius: 100px; font-size: .78rem; font-weight: 600;
  cursor: pointer; transition: all .15s; background: transparent; color: var(--text);
  touch-action: manipulation;
}
.chip:hover { border-color: var(--red); color: var(--red); }
.chip.on { background: var(--red); color: #fff; border-color: var(--red); }

/* ── PRODUCT GRID ── */
.tabs { display: flex; gap: .35rem; overflow-x: auto; padding: .65rem 1rem; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: .4rem .9rem; border: 1.5px solid var(--border); border-radius: 100px;
  background: transparent; color: var(--muted); font-family: var(--body);
  font-weight: 600; font-size: .76rem; cursor: pointer; white-space: nowrap;
  transition: all .15s; flex-shrink: 0;
}
.tab-btn.active { background: var(--red); color: #fff; border-color: var(--red); }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; padding: 0 .9rem .9rem; }
.pcard {
  background: var(--dark3); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; cursor: pointer;
  transition: transform .18s, border-color .18s, box-shadow .18s; position: relative;
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(200,35,43,.15);
}
.pcard:hover { border-color: var(--red); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(200,35,43,.15); }
.pcard.unavail { opacity: .5; cursor: not-allowed; }
.pcard-img { width: 100%; height: 112px; background: var(--dark4); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }
.pcard-img img { width: 100%; height: 100%; object-fit: cover; }
.pcard-fav {
  position: absolute; top: .45rem; left: .45rem; z-index: 2;
  background: rgba(0,0,0,.5); border: none; border-radius: 50%;
  width: 28px; height: 28px; cursor: pointer; font-size: .9rem;
  display: flex; align-items: center; justify-content: center;
}
.pcard-body { padding: .6rem .7rem .65rem; }
.pcard-name { font-weight: 700; font-size: .85rem; line-height: 1.25; margin-bottom: .15rem; color: var(--text); }
.pcard-desc { font-size: .7rem; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard-foot { display: flex; align-items: center; justify-content: space-between; margin-top: .5rem; gap: .4rem; }
.pcard-price { font-family: var(--head); font-weight: 800; color: var(--gold); font-size: .98rem; }
.pcard-add {
  width: 30px; height: 30px; border-radius: 50%; border: none; flex-shrink: 0;
  background: var(--red); color: #fff; font-size: 1.25rem; line-height: 1;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: transform .12s, background .12s; -webkit-tap-highlight-color: transparent;
}
.pcard-add:hover { background: var(--red2); transform: scale(1.08); }
.pcard-add:active { transform: scale(.92); }
.soon-badge {
  position: absolute; top: .45rem; right: .45rem;
  background: var(--red); color: #fff; font-size: .6rem;
  font-weight: 700; padding: .18rem .45rem; border-radius: 100px; text-transform: uppercase;
}

/* ── CART ── */
.cart-item {
  display: flex; align-items: center; gap: .7rem;
  padding: .55rem .65rem; margin-bottom: .5rem;
  background: var(--dark3); border: 1px solid var(--border); border-radius: 12px;
}
.cart-item-tile { width: 40px; height: 40px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; background: var(--dark4); }
.cart-item-name { font-weight: 700; font-size: .85rem; margin-bottom: .1rem; }
.cart-item-detail { font-size: .72rem; color: var(--muted); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-item-price { font-family: var(--head); font-weight: 800; color: var(--gold); white-space: nowrap; font-size: .92rem; }
.cart-btn { width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: .78rem; }
.empty-state { text-align: center; padding: 3.5rem 1rem; color: var(--muted); }
.empty-state .icon { font-size: 3.5rem; margin-bottom: .75rem; }
.empty-state .title { font-family: var(--head); font-size: 1.2rem; font-weight: 800; color: var(--text); margin-bottom: .4rem; }

/* ── SLOTS ── */
.slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.slot-btn {
  padding: .75rem .5rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--dark3); color: var(--text) !important; font-family: var(--body);
  font-weight: 700; font-size: .9rem; cursor: pointer; transition: all .15s;
  text-align: center; width: 100%; display: block; min-height: 44px;
  -webkit-appearance: none; appearance: none;
}
.slot-btn:hover:not(.full):not(.on) { border-color: var(--red); color: var(--red) !important; }
.slot-btn.on { background: var(--red) !important; color: #fff !important; border-color: var(--red) !important; }
.slot-btn.full { opacity: .35; cursor: not-allowed; background: var(--dark4); }

/* ── PAYMENT ── */
.pay-opt {
  display: flex; align-items: center; gap: .9rem; padding: .85rem;
  border: 2px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: all .15s; margin-bottom: .55rem;
}
.pay-opt:hover { border-color: var(--red); }
.pay-opt.on { border-color: var(--red); background: rgba(200,35,43,.07); }

/* ── STATUS ── */
.status-badge {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .25rem .7rem; border-radius: 100px; font-size: .72rem; font-weight: 700;
}

/* ── PROFILE ── */
.pts-card {
  background: linear-gradient(135deg, #1c0506, #2e0809);
  border: 1px solid rgba(200,35,43,.3); border-radius: var(--radius); padding: 1.35rem;
  position: relative; overflow: hidden;
}
.pts-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 20% 50%, rgba(200,35,43,.12), transparent 60%);
}
.pts-value { font-family: var(--head); font-size: 2.8rem; font-weight: 800; color: var(--red); line-height: 1; position: relative; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--red); display: flex; align-items: center;
  justify-content: center; font-family: var(--head);
  font-weight: 800; font-size: .95rem; color: #fff; flex-shrink: 0;
}

/* ── ADMIN ── */
.admin-tabs { display: flex; flex-wrap: wrap; gap: .4rem; padding: .85rem; }
.admin-tab {
  flex: 1; min-width: 80px; padding: .62rem .4rem;
  background: var(--dark3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--muted);
  font-family: var(--body); font-weight: 600; font-size: .72rem;
  cursor: pointer; text-align: center; transition: all .15s;
}
.admin-tab.active, .admin-tab:hover { border-color: var(--red); color: var(--red); background: rgba(200,35,43,.07); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; padding: 0 .9rem; }
.stat-grid.cols-3 { grid-template-columns: repeat(3, 1fr); gap: .45rem; }
.stat-grid.cols-3 .stat-card { padding: .7rem .35rem; }
.stat-grid.cols-3 .stat-val { font-size: 1.25rem; }
.stat-grid.cols-3 .stat-lbl { font-size: .64rem; white-space: nowrap; }
.stat-card { background: var(--dark3); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem; text-align: center; }
.stat-val { font-family: var(--head); font-size: 1.5rem; font-weight: 800; color: var(--red); }
.stat-lbl { font-size: .68rem; color: var(--muted); margin-top: .15rem; }

/* ── SECTION TITLE ── */
.sec-title {
  font-family: var(--head); font-size: 1rem; font-weight: 800;
  margin-bottom: .85rem; display: flex; align-items: center; gap: .5rem;
  text-transform: uppercase; letter-spacing: .04em;
}
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── TOAST ── */
.toast-wrap { position: fixed; top: 1rem; right: 1rem; z-index: 99999; display: flex; flex-direction: column; gap: .4rem; max-width: 290px; pointer-events: none; }
.toast {
  padding: .65rem 1.1rem; border-radius: 10px; font-weight: 600;
  font-size: .85rem; animation: slideUp .25s ease; pointer-events: auto;
}
.toast-success { background: #166534; color: #fff; }
.toast-error { background: #991b1b; color: #fff; }
.toast-info { background: #1e3a5f; color: #fff; }
.toast-warning { background: #854d0e; color: #fff; }

/* ── UTILS ── */
.divider { height: 1px; background: var(--border); margin: 1.1rem 0; }

function checkAppUpdate() {
  try {
    var stored = localStorage.getItem('_ba_app_version');

      localStorage.setItem('_ba_app_version', APP_VERSION);
      // Vider le cache service worker si possible
      if ('caches' in window) {
        caches.keys().then(function(names){
          names.forEach(function(n){ caches.delete(n); });
        });
      }
      window.location.reload(true);
    } else {
      localStorage.setItem('_ba_app_version', APP_VERSION);
    }
  } catch(e) {}
}

// OneSignal init
var ONESIGNAL_APP_ID = '924617f0-5d1b-47ea-8951-1f2e86ec8eb1';
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(function(OneSignal) {
  OneSignal.init({
    appId: ONESIGNAL_APP_ID,
    allowLocalhostAsSecureOrigin: true,
    serviceWorkerPath: 'OneSignalSDK.sw.js',

    notifyButton: { enable: false }
  });
});

function osSubscribe(userId) {
  if (!window.OneSignalDeferred) return;
  OneSignalDeferred.push(function(OneSignal) {
    // Demande permission si pas encore accordée
    OneSignal.Notifications.requestPermission();
    // Lie l'external_id (pour ciblage par external_id)
    OneSignal.login(userId).catch(function(e){ console.warn('OS login:', e); });
    // Ajoute aussi le tag (double sécurité)
    OneSignal.User.addTag('userId', userId);
  });
}

// OneSignal REST API key - needed to send push from browser
// Get it from OneSignal Dashboard > Settings > Keys & IDs > REST API Key
var OS_REST_KEY = 'os_v2_app_sjdbp4c5dnd6vckrd4xin3eowfvscoorm5cu3tvek5nbtqgcaixhwzcsb4k7lmhocbybzbzdawmfzlqgxhug4r5odi66d5q5h4exzbi';

function osSendPush(userId, title, body, delayMs) {
  if (!OS_REST_KEY) {
    console.log('OneSignal REST key not set - storing in queue');
    db.ref('os_queue/'+Date.now()).set({
      userId:userId, title:title, body:body,
      delayMs:delayMs||0, at:new Date().toISOString(), sent:false
    });
    return;
  }
  // Ciblage par external_id (lié via OneSignal.login(userId) lors de la connexion)
  var payload = {
    app_id: ONESIGNAL_APP_ID,
    target_channel: 'push',
    include_aliases: { external_id: [String(userId)] },
    headings: {en: title, fr: title},
    contents: {en: body, fr: body},
    url: 'https://break-antillais.github.io/break-antillais',
    web_url: 'https://break-antillais.github.io/break-antillais'
  };
  if (delayMs) {
    payload.send_after = new Date(Date.now() + delayMs).toISOString();
  }
  fetch('https://onesignal.com/api/v1/notifications', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Basic '+OS_REST_KEY
    },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); })
    .then(function(d){ console.log('OneSignal sent:', d); })
    .catch(function(e){ console.warn('OneSignal error:', e); });
}

function load(key, def) {
  try {
    var v = localStorage.getItem('_ba_'+key);
    if (!v) return def;
    var parsed = JSON.parse(v);
    // Si on attend un tableau (def=[]) mais Firebase a sauvegardé un objet, convertir
    if (Array.isArray(def) && parsed !== null && !Array.isArray(parsed) && typeof parsed === 'object') {
      return Object.values(parsed).filter(function(x){ return x && typeof x === 'object'; });
    }
    return parsed;
  } catch(e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem('_ba_'+key, JSON.stringify(val)); } catch(e) {}
  db.ref('data/'+key).set(val !== undefined ? val : null).catch(function(e){ console.warn('FB write:',e); });
}

// Save single user by ID (prevents overwriting other users)
function saveUserToFirebase(user) {
  // Save individually to prevent overwrite
  db.ref('data/users/'+user.id).set(user).catch(function(e){ console.warn('FB user write:',e); });
  // Update local cache
  var users = load('ba_users', []);
  var idx = users.findIndex(function(u){ return u.id === user.id; });
  if (idx >= 0) users[idx] = user; else users.push(user);
  try { localStorage.setItem('_ba_ba_users', JSON.stringify(users)); } catch(e) {}
}

function loadFromFirebase(cb) {
  db.ref('data').once('value').then(function(snap) {
    var d = snap.val() || {};
    // Load all flat data
    Object.keys(d).forEach(function(k){
      if (k === 'users') return;
      var val = d[k];
      // Firebase retourne les arrays comme objets → convertir en tableau si nécessaire
      if (k === 'ba_products' || k === 'ba_orders' || k === 'ba_meats' || k === 'ba_sauces' || k === 'ba_supplements') {
        if (val && !Array.isArray(val) && typeof val === 'object') {
          val = Object.values(val).filter(function(v){ return v && typeof v === 'object'; });
        }
      }
      // Pour ba_orders : fusionner avec ba_safe pour ne jamais perdre de commandes
      if (k === 'ba_safe' && val && typeof val === 'object') {
        // ba_safe est l'archive permanente - fusionner dans ba_orders
        var safeArr = Array.isArray(val) ? val : Object.values(val).filter(function(x){ return x && x.id; });
        try {
          var existing = JSON.parse(localStorage.getItem('_ba_ba_orders')||'[]');
          if (!Array.isArray(existing)) existing = [];
          safeArr.forEach(function(o){
            if (!o || !o.id) return;
            var i = existing.findIndex(function(x){ return x && x.id === o.id; });
            if (i < 0) existing.push(o); // ajouter les commandes manquantes
            else if (existing[i].status !== o.status) existing[i] = o; // mettre à jour si statut différent
          });
          localStorage.setItem('_ba_ba_orders', JSON.stringify(existing));
        } catch(e) {}
        return;
      }
      // Pour ba_orders : Firebase est la source de vérité
      // Fusionner uniquement si localStorage a des commandes récentes non encore dans Firebase
      if (k === 'ba_orders' && Array.isArray(val)) {
        try {
          var existing = JSON.parse(localStorage.getItem('_ba_ba_orders')||'[]');
          if (!Array.isArray(existing)) existing = [];
          // Partir de Firebase (source de vérité) et ajouter les commandes locales non encore sync
          var merged = val.slice();
          existing.forEach(function(o){
            if (!o || !o.id) return;
            var inFirebase = val.findIndex(function(x){ return x && x.id === o.id; });
            if (inFirebase < 0) merged.push(o); // commande locale pas encore dans Firebase
          });
          localStorage.setItem('_ba_ba_orders', JSON.stringify(merged));
          console.log('[BA] loadFromFirebase: '+merged.length+' commandes chargées');
        } catch(e) { try { localStorage.setItem('_ba_'+k, JSON.stringify(val)); } catch(e2) {} }
        return;
      }
      try { localStorage.setItem('_ba_'+k, JSON.stringify(val)); } catch(e) {}
    });
    // Merge users: from ba_users array (old format) + users object (new format)
    var mergedUsers = {};
    // Old format: ba_users is an array
    var oldUsers = d['ba_users'] || [];
    if (Array.isArray(oldUsers)) {
      oldUsers.forEach(function(u){ if(u && u.id) mergedUsers[u.id] = u; });
    }
    // New format: users is an object keyed by ID
    var newUsers = d['users'] || {};
    Object.keys(newUsers).forEach(function(id){
      if (newUsers[id]) mergedUsers[id] = newUsers[id];
    });
    var usersArr = Object.values(mergedUsers);
    if (usersArr.length > 0) {
      try { localStorage.setItem('_ba_ba_users', JSON.stringify(usersArr)); } catch(e) {}
    }
    cb();
  }).catch(function(e){ console.warn('Firebase load error:', e); cb(); });
}

function startFirebaseListeners() {
  var user = getCurrentUser();
  var isAdmin = user && (user.role==='superadmin'||user.role==='admin'||user.role==='entreprise'||user.role==='preparateur');
  console.log('[Firebase] Starting listeners, user:', user ? user.prenom : 'none', 'isAdmin:', isAdmin);

  // ── Sync config temps réel (créneaux bloqués, horaires, réglages) ──
  // Sans ce listener, une modif faite sur un appareil restait invisible sur les autres :
  // save() écrivait bien dans Firebase, mais personne n'écoutait les changements.
  db.ref('data/ba_cfg').on('value', function(snap){
    var v = snap.val();
    // Protections : ne jamais écraser le cache avec du vide/invalide
    if (!v || typeof v !== 'object' || Array.isArray(v)) return;
    if (Object.keys(v).length === 0) return;
    var newStr;
    try { newStr = JSON.stringify(v); } catch(e) { return; }
    if (localStorage.getItem('_ba_ba_cfg') === newStr) return; // déjà à jour
    try { localStorage.setItem('_ba_ba_cfg', newStr); } catch(e) {}
    console.log('[BA] Config synchronisee depuis Firebase');
    // Ne pas re-render si une saisie est en cours (sinon on perd la frappe)
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
    // Rafraîchissement chirurgical des pastilles de créneaux (pas de re-render complet)
    try {
      ['slot-toggles-orders','slot-toggles-config'].forEach(function(id){
        var el = document.getElementById(id);
        if (el && typeof buildSlotToggles === 'function') el.innerHTML = buildSlotToggles();
      });
    } catch(e) { console.warn('[BA] refresh creneaux:', e); }
    // Côté client : rafraîchir l'accueil (statut ouvert/ferme, horaires)
    var u = getCurrentUser();
    var uIsAdmin = u && (u.role==='superadmin'||u.role==='admin'||u.role==='entreprise'||u.role==='preparateur');
    if (!uIsAdmin && currentScreen === 'home' && typeof renderHome === 'function') renderHome();
  });

  // Real-time orders sync - with status change detection
  // Listener viandes temps réel — met à jour les chips si la modale est ouverte
  // Listener stocks partages (agoulou + menu enfant agoulou)
  Object.keys(SHARED_STOCK_CATS).forEach(function(cat){
    var key = SHARED_STOCK_CATS[cat];
    db.ref('data/'+key).on('value', function(snap){
      var v = snap.val();
      if (!v && v !== 0) return;
      var st = (typeof v === 'object') ? v.stock : v;
      var ok = (typeof v === 'object') ? v.ok : (st > 0);
      save(key, st);
      // Mettre a jour tous les produits de la categorie en local
      var prods = load('ba_products', []);
      if (!Array.isArray(prods)) prods = Object.values(prods);
      var changed = false;
      prods.forEach(function(p){
        if (p && p.cat === cat) {
          p.stock = st;
          p.ok = ok && (st === null || st > 0);
          changed = true;
        }
      });
      if (changed) {
        try { localStorage.setItem('_ba_ba_products', JSON.stringify(prods)); } catch(e){}
        if (typeof renderHome === 'function' && document.getElementById('home-body')) renderHome();
      }
    });
  });

  db.ref('data/ba_meats').on('value', function(snap){
    var v = snap.val();
    if (!v) return;
    var arr = Array.isArray(v) ? v : Object.values(v).filter(function(x){ return x && x.name; });
    if (arr.length) {
      try { localStorage.setItem('_ba_ba_meats', JSON.stringify(arr)); } catch(e){}
      // Mettre à jour les chips viande si la modale produit est ouverte
      var chips = document.querySelectorAll('#meat-chips .chip');
      if (chips.length) {
        chips.forEach(function(chip) {
          var meatName = chip.dataset.v;
          var meat = arr.find(function(m){ return m.name === meatName; });
          if (!meat) return;
          if (!meat.ok) {
            chip.disabled = true;
            chip.style.opacity = '.4';
            chip.style.cursor = 'not-allowed';
            chip.style.pointerEvents = 'none';
            chip.classList.remove('on');
            // Retirer du pendingExtras si sélectionné
            if (pendingExtras && pendingExtras.meats) {
              var i = pendingExtras.meats.indexOf(meatName);
              if (i >= 0) pendingExtras.meats.splice(i, 1);
            }
          } else {
            chip.disabled = false;
            chip.style.opacity = '';
            chip.style.cursor = '';
            chip.style.pointerEvents = '';
          }
        });
      }
    }
  });

  db.ref('data/ba_orders').on('value', function(snap){
    var v = snap.val();
    if (v === null || v === undefined) return;
    // Protéger contre un objet vide qui écraserait les commandes
    if (typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 0) return;
    var newOrders = Array.isArray(v) ? v : Object.values(v).filter(function(x){ return x && x.id; });
    // Relire user/isAdmin à chaque déclenchement (pas capturé au démarrage)
    var user = getCurrentUser();
    var isAdmin = user && (user.role==='superadmin'||user.role==='admin'||user.role==='entreprise'||user.role==='preparateur');
    var oldOrdersStr = localStorage.getItem('_ba_ba_orders');
    var _oldRaw = oldOrdersStr ? JSON.parse(oldOrdersStr) : [];
    var oldOrders = Array.isArray(_oldRaw) ? _oldRaw : Object.values(_oldRaw || {}).filter(function(x){ return x && typeof x === 'object'; });

    // Detect status changes for current client
    if (user && !isAdmin) {
      newOrders.forEach(function(newO) {
        if (!newO || newO.userId !== user.id) return;
        var oldO = oldOrders.find(function(o){ return o.id === newO.id; });
        if (oldO && oldO.status !== newO.status) {
          // Status changed!
          if (newO.status === 'ready') {
            showOrderReadyAlert(newO);
          } else if (newO.status === 'confirmed' || newO.status === 'preparing') {
            var msgs = {
              confirmed: '✅ Commande confirmee !',
              preparing: '👨‍🍳 Votre commande est en preparation !'
            };
            toast(msgs[newO.status]||'Statut mis a jour', 'info', 5000);
            sendPushNotif('Break Antillais', msgs[newO.status]||'Statut mis a jour');
          }
        }
      });
    }

    // Detect new orders for admin
    if (isAdmin && _adminAlertEnabled) {
      var newPending = newOrders.filter(function(o){ return o && o.status==='pending'; });
      var oldPending = oldOrders.filter(function(o){ return o && o.status==='pending'; });
      if (_lastOrderCount >= 0 && newPending.length > oldPending.length) {
        var added = newPending.filter(function(no){
          return !oldPending.find(function(oo){ return oo.id===no.id; });
        });
        added.forEach(function(o){
          playAdminAlert();
          showNewOrderBanner(o);
          sendPushNotif('🆕 Nouvelle commande !', 'N°'+o.orderNumber+' — '+o.userPrenom+' — '+fmt(o.total||0));
        });
      }
      _lastOrderCount = newPending.length;
    }

    // Save to cache - ne jamais réduire le nombre de commandes (protection perte)
    try {
      var existingStr = localStorage.getItem('_ba_ba_orders');
      var existing = existingStr ? JSON.parse(existingStr) : [];
      if (!Array.isArray(existing)) existing = Object.values(existing||{}).filter(function(x){return x&&x.id;});
      // Fusionner : garder toutes les commandes existantes + nouvelles de Firebase
      var merged = existing.slice();
      newOrders.forEach(function(o){
        if (!o || !o.id) return;
        var i = merged.findIndex(function(x){ return x && x.id === o.id; });
        if (i >= 0) merged[i] = o; else merged.push(o);
      });
      localStorage.setItem('_ba_ba_orders', JSON.stringify(merged));
      // Mettre à jour newOrders pour les comparaisons suivantes
      newOrders = merged;
    } catch(e) {}

    // Refresh UI - TOUJOURS pour le client, même si pas sur l'écran commandes
    if (!isAdmin) {
      // Vérifier si un statut a changé pour ce client
      var hasChange = false;
      var curUser = getCurrentUser();
      if (curUser) {
        newOrders.forEach(function(newO) {
          if (!newO || newO.userId !== curUser.id) return;
          var oldO = oldOrders.find(function(x){ return x && x.id === newO.id; });
          if (!oldO || oldO.status !== newO.status || oldO.clientPresent !== newO.clientPresent) {
            hasChange = true;
            console.log('[BA] Changement détecté commande N°'+newO.orderNumber+' :', (oldO&&oldO.status)||'?', '->', newO.status);
          }
        });
      }
      // Rafraîchir l'écran commandes si visible ou si changement de statut
      if (currentScreen === 'orders' || hasChange) {
        renderOrders();
        // Si on n'est pas sur commandes mais qu'il y a un changement, naviguer vers commandes
        if (hasChange && currentScreen !== 'orders') {
          console.log('[BA] Changement statut détecté, rafraîchissement silencieux');
        }
      }
    }
    if (isAdmin) {
      // Rafraîchir l'UI admin quel que soit l'écran actuel
      // (ecran Commandes du menu du bas OU panneau admin dans Profil)
      if (!refreshAdminOrdersView()) {
        var ac = adminContentEl();
        var activeTab = document.querySelector('.admin-tab.active');
        if (ac && activeTab && activeTab.textContent.indexOf('Dashboard') >= 0) ac.innerHTML = adminDashboard();
      }
    }
  });

  // Real-time users sync
  var mergeUsers = function(refreshUI) {
    var mergedUsers = {};
    db.ref('data/ba_users').once('value').then(function(s1){
      var old = s1.val() || [];
      if (Array.isArray(old)) old.forEach(function(u){ if(u&&u.id) mergedUsers[u.id]=u; });
      return db.ref('data/users').once('value');
    }).then(function(s2){
      var newU = s2.val() || {};
      Object.keys(newU).forEach(function(id){ if(newU[id]) mergedUsers[id]=newU[id]; });
      var arr = Object.values(mergedUsers);
      if (arr.length > 0) try { localStorage.setItem('_ba_ba_users', JSON.stringify(arr)); } catch(e) {}
      if (refreshUI) refreshUsersUI();
    });
  };
  // Rafraichit les ecrans admin qui dependent des utilisateurs (Clients / Dashboard),
  // sans re-render si une saisie est en cours (sinon on perd la frappe).
  function refreshUsersUI() {
    var ae = document.activeElement;
    if (ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')) return;
    var u = getCurrentUser();
    var uIsAdmin = u && (u.role==='superadmin'||u.role==='admin'||u.role==='entreprise'||u.role==='preparateur');
    if (!uIsAdmin) return;
    updateBadges();
    var ac = adminContentEl();
    var at = document.querySelector('.admin-tab.active');
    if (ac && at) {
      var lbl = at.textContent;
      if (lbl.indexOf('Clients') >= 0 && typeof adminClients === 'function') ac.innerHTML = adminClients();
      else if (lbl.indexOf('Dashboard') >= 0 && typeof adminDashboard === 'function') ac.innerHTML = adminDashboard();
    }
  }
  // Listener temps reel : une inscription ou une connexion (lastLogin) se voit
  // instantanement sur tous les appareils admin. Avant, data/users n'etait lu
  // qu'une fois au demarrage (.once), donc rien ne remontait en direct.
  // IMPORTANT (confidentialite/RGPD) : reserve aux comptes cote stand. Un client
  // ordinaire n'a aucune raison de telecharger l'annuaire complet de la clientele.
  if (isAdmin) {
    db.ref('data/users').on('value', function(snap){
      var v = snap.val();
      if (!v || typeof v !== 'object') return;
      mergeUsers(true);
    });
    // Ancien noeud (comptes historiques) : lecture unique suffisante
    db.ref('data/ba_users').once('value').then(function(){ mergeUsers(false); });
  }

  // Sync produits en temps réel (stock agoulou etc.)
  // Produits : lecture unique (stock mis à jour manuellement)
  db.ref('data/ba_products').once('value').then(function(snap){
    var v = snap.val();
    if (v === null) return;
    var arr = Array.isArray(v) ? v : Object.values(v).filter(function(x){ return x && x.id; });
    try { localStorage.setItem('_ba_ba_products', JSON.stringify(arr)); } catch(e) {}
    // Rafraîchir l'affichage produits
    if (typeof renderHome === 'function' && document.getElementById('home-body')) renderHome();
    if (currentScreen === 'home') renderHome();
  }).catch(function(e){ console.warn('products load:', e); });

  // Listen for real-time status updates
  if (user && !isAdmin) {
    // Only show updates written after session started
    var _sessionStart = new Date().toISOString();
    db.ref('status_updates/'+user.id).on('child_added', function(snap) {
      var update = snap.val();
      if (!update || !update.at) { snap.ref.remove(); return; }
      // Only process updates written after we connected
      if (update.at < _sessionStart) { snap.ref.remove(); return; }
      if (update.status === 'ready') {
        launchConfetti(3000);
        showOrderReadyAlert({orderNumber: update.orderNumber, id: update.orderId});
        sendPushNotif(update.title, update.body);
      } else if (update.status === 'confirmed' || update.status === 'preparing') {
        toast('📦 '+update.title+' — '+update.body, 'info', 7000);
        sendPushNotif(update.title, update.body);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } else if (update.status === 'check_palier') {
        // Vérifier si nouveau palier atteint
        var curUser = getCurrentUser();
        if (curUser) {
          var pts = curUser.points || 0;
          var paliers = load('ba_paliers', []);
          paliers.forEach(function(p) {
            var pSeuil = p.pts||p.min||0;
            if (pts >= pSeuil && pts - (update.pts||0) < pSeuil) {
              launchConfetti(4000);
              toast('🎉 Félicitations ! Vous atteignez le palier ' + p.name + ' !', 'success', 5000);
            }
          });
        }
      } else if (update.status === 'picked_up') {
        toast('✅ '+update.body, 'success', 5000);
      } else if (update.status === 'client_present') {
        // Mêmes notifs que nouvelle commande
        playAdminAlert();
        if (navigator.vibrate) navigator.vibrate([200,100,200]);
        // Bannière identique à nouvelle commande mais orange
        var existing2 = document.getElementById('new-order-banner');
        if (existing2) existing2.remove();
        var banner2 = document.createElement('div');
        banner2.id = 'new-order-banner';
        banner2.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:linear-gradient(135deg,#92400e,#d97706);color:#fff;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;animation:slideDown .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.5)';
        banner2.innerHTML = '<div>'
          +'<div style="font-family:var(--head);font-weight:800;font-size:1.05rem">📍 Client sur place !</div>'
          +'<div style="font-size:.85rem;opacity:.9">'+update.title.replace('📍 ','')+'</div>'
          +'</div>'
          +'<div style="display:flex;gap:.5rem">'
          +'<button style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:.45rem .9rem;border-radius:8px;cursor:pointer;font-weight:700;font-size:.85rem" onclick="document.getElementById(&quot;new-order-banner&quot;).remove();go(&quot;profile&quot;)">Voir</button>'
          +'<button style="background:transparent;border:none;color:#fff;cursor:pointer;font-size:1.2rem;padding:.2rem .5rem" onclick="document.getElementById(&quot;new-order-banner&quot;).remove()">✕</button>'
          +'</div>';
        document.body.appendChild(banner2);
        setTimeout(function(){ if(banner2.parentNode) banner2.remove(); }, 10000);
        // Rafraîchir l'UI admin
        var ac2 = adminContentEl();
        var activeTab2 = document.querySelector('.admin-tab.active');
        if (ac2 && activeTab2 && activeTab2.textContent.indexOf('Commandes') >= 0) {
          ac2.innerHTML = adminOrders();
          setTimeout(function(){
            var card = document.getElementById('oc-'+update.orderId);
            if (card) card.classList.add('presence-flash');
          }, 150);
        }
      } else {
        // Message admin / offre / relance
        toast('📣 '+update.title+' : '+update.body, 'info', 8000);
        sendPushNotif(update.title, update.body);
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
      }
      snap.ref.remove();
    });
  }
}

// load/save defined above with Firebase

function getUsers() {
  var v = load('ba_users', []);
  if (!v) return [];
  if (Array.isArray(v)) return v;
  return Object.values(v).filter(function(x){ return x && typeof x === 'object'; });
}
function getOrders() {
  var v = load('ba_orders', []);
  if (!v) return [];
  var arr = Array.isArray(v) ? v : Object.values(v).filter(function(x){ return x && typeof x === 'object'; });
  return arr.filter(function(x){ return x && x.id; });
}
function getProducts() {
  var deleted = load('ba_deleted_products', []);
  var saved = load('ba_products', null);
  if (!saved) {
    return DEFAULT_PRODUCTS.filter(function(p){ return deleted.indexOf(p.id) < 0; });
  }
  // Défense : si saved est un objet Firebase (pas un tableau), le convertir
  if (!Array.isArray(saved)) {
    saved = Object.values(saved).filter(function(p){ return p && p.id; });
    save('ba_products', saved);
  }
  if (!saved.length) {
    return DEFAULT_PRODUCTS.filter(function(p){ return deleted.indexOf(p.id) < 0; });
  }
  // Merge: add new default products not yet in saved list AND not deleted
  var savedIds = saved.map(function(p){ return p.id; });
  var missing = DEFAULT_PRODUCTS.filter(function(p){
    return savedIds.indexOf(p.id) < 0 && deleted.indexOf(p.id) < 0;
  });
  if (missing.length > 0) {
    var merged = saved.concat(missing);
    save('ba_products', merged);
    return merged;
  }
  // Filter out any deleted that snuck back in
  return saved.filter(function(p){ return deleted.indexOf(p.id) < 0; });
}
function getCfg() {
  var stored = load('ba_cfg', {});
  var merged = {};
  Object.keys(DEFAULT_CFG).forEach(function(k){ merged[k] = DEFAULT_CFG[k]; });
  if (stored && typeof stored === 'object') {
    Object.keys(stored).forEach(function(k){ merged[k] = stored[k]; });
  }
  return merged;
}
function getCurrentUser() {
  var uid = sessionStorage.getItem('ba_uid');
  if (!uid) {
    // Vérifier si la session persistante est encore valide
    var expiry = parseInt(localStorage.getItem('ba_uid_expiry')||'0');
    if (expiry && new Date().getTime() < expiry) {
      uid = localStorage.getItem('ba_uid_persist');
    } else if (expiry) {
      // Session expirée → déconnexion propre
      localStorage.removeItem('ba_uid_persist');
      localStorage.removeItem('ba_uid_expiry');
    }
  }
  if (!uid) return null;
  var user = getUsers().find(function(u){ return u.id === uid; }) || null;
  if (user && !sessionStorage.getItem('ba_uid')) sessionStorage.setItem('ba_uid', user.id);
  return user;
}
function setCurrentUser(user, remember) {
  if (user) {
    sessionStorage.setItem('ba_uid', user.id);
    // Toujours persister avec expiration 21 jours (indépendant de la case remember)
    var expiry = new Date().getTime() + 21 * 24 * 60 * 60 * 1000;
    localStorage.setItem('ba_uid_persist', user.id);
    localStorage.setItem('ba_uid_expiry', String(expiry));
  } else {
    sessionStorage.removeItem('ba_uid');
    localStorage.removeItem('ba_uid_persist');
    localStorage.removeItem('ba_uid_expiry');
  }
}
function saveUser(user) {
  // Save individually in Firebase to prevent overwriting other users
  saveUserToFirebase(user);

function saveOrder(order) {
  // Mettre à jour le cache localStorage
  var orders = getOrders();
  var idx = orders.findIndex(function(o){ return o.id === order.id; });
  if (idx >= 0) orders[idx] = order; else orders.push(order);
  try { localStorage.setItem('_ba_ba_orders', JSON.stringify(orders)); } catch(e) {}
  // 1. Nœud principal de l'app
  db.ref('data/ba_orders/'+order.id).set(order).catch(function(e){ console.warn('FB saveOrder:',e); });
  // 2. Archive permanente — JAMAIS effacée, source de vérité absolue
  var archiveData = Object.assign({}, order, {_savedAt: new Date().toISOString()});
  db.ref('data/ba_safe/'+order.id).set(archiveData).catch(function(e){ console.warn('safe write:', e); });
  // 3. Journal par date — pour retrouver les commandes d'un jour précis
  var dateKey = (order.pickupDate || new Date().toISOString().split('T')[0]);
  db.ref('data/ba_journal/'+dateKey+'/'+order.id).set(archiveData).catch(function(e){});
  // 4. Archive mensuelle — groupée par mois pour consultation comptable
  var monthKey = dateKey.substring(0,7); // YYYY-MM
  db.ref('data/ba_archive/'+monthKey+'/'+order.id).set(archiveData).catch(function(e){});
  try { localStorage.setItem('_ba_ba_last_save', JSON.stringify(new Date().toISOString())); } catch(e) {}
  // Déclencher snapshot différé (sans bloquer)
  setTimeout(function(){ if (typeof snapshotAll === 'function') snapshotAll(); }, 3000);
}
// ── Stocks partages par categorie ──
// Certaines categories puisent dans le meme stock physique : les 3 agoulous
// partagent les memes pains, et les menus enfant agoulou les mini pains.
// Le stock vit dans un noeud Firebase dedie (avec listener) pour que TOUS les
// appareils se synchronisent, y compris apres une commande passee par un client.
var SHARED_STOCK_CATS = {
  agoulou: 'ba_agoulou_stock',
  enfant_agoulou: 'ba_enfant_agoulou_stock'
};
function getGroupStock(cat) {
  var key = SHARED_STOCK_CATS[cat];
  if (!key) return null;
  var v = load(key, null);
  if (v !== null && v !== undefined) return v;
  // Fallback : lire sur le premier produit de la categorie
  var prods = load('ba_products', []);
  if (!Array.isArray(prods)) prods = Object.values(prods);
  var a = prods.find(function(p){ return p && p.cat === cat && p.stock !== null && p.stock !== undefined; });
  return a ? a.stock : null;
}
function setGroupStock(cat, stock, okVal) {
  var key = SHARED_STOCK_CATS[cat];
  if (!key) return;
  save(key, stock);
  db.ref('data/'+key).set({stock: stock, ok: okVal !== false});
  // Propager sur tous les produits de la categorie
  var prods = getProducts().filter(function(p){ return p.cat === cat; });
  prods.forEach(function(p) {
    p.stock = stock;
    p.ok = (stock === null || stock > 0) && (okVal !== false);
    saveProduct(p);
    db.ref('data/ba_products/'+p.id).update({stock: stock, ok: p.ok});
  });
  renderHome();
}
// Compat : anciens appels
function getAgoulouStock() { return getGroupStock('agoulou'); }
function setAgoulouStock(stock, okVal) { return setGroupStock('agoulou', stock, okVal); }


function saveProduct(p) {
  var pToSave = Object.assign({}, p);
  // Si stock = 0, forcer ok = false
  if (pToSave.stock !== null && pToSave.stock !== undefined && pToSave.stock === 0) {
    pToSave.ok = false;
  }
  if (p.image && p.image.length > 500 && p.image.indexOf('data:') === 0) {
    db.ref('data/product_images/' + p.id).set(p.image)
      .catch(function(e){ console.warn('Image save error:', e); });
    pToSave.image = '__firebase__' + p.id;
    pToSave._imageRef = p.id;
  }
  // Sync Firebase complet du produit — nettoyer les undefined
  var fbData = {};
  Object.keys(pToSave).forEach(function(k){
    if (pToSave[k] !== undefined) fbData[k] = pToSave[k];
  });
  if (fbData.image && fbData.image.length > 500) delete fbData.image;
  db.ref('data/ba_products/' + pToSave.id).set(fbData)
    .catch(function(e){ console.warn('FB saveProduct:', e); });
  var saved = load('ba_products', null);
  if (!saved) saved = DEFAULT_PRODUCTS.slice();
  if (!Array.isArray(saved)) saved = Object.values(saved).filter(function(p){ return p && p.id; });
  var idx = saved.findIndex(function(x){ return x.id === pToSave.id; });
  if (idx >= 0) saved[idx] = pToSave; else saved.push(pToSave);
  save('ba_products', saved);
}


// Charger et injecter les images produits stockées dans Firebase
function loadProductImages() {
  var prods = getProducts();
  prods.forEach(function(p) {
    if (p.image && p.image.indexOf('__firebase__') === 0) {
      var refId = p._imageRef || p.id;
      db.ref('data/product_images/' + refId).once('value').then(function(snap){
        var imgData = snap.val();
        if (!imgData) return;
        // Mettre à jour le produit en mémoire
        p.image = imgData;
        // Mettre à jour l'affichage si la carte est visible
        var wrap = document.getElementById('pwrap-'+p.id);
        if (wrap) {
          wrap.outerHTML = '<div class="pcard-img"><img src="'+imgData+'" id="pimg-'+p.id+'" alt="'+p.name+'" /></div>';
        }
        var imgEl = document.getElementById('pimg-'+p.id);
        if (imgEl) imgEl.src = imgData;
      }).catch(function(){});
    }
  });
}

// Charger l'image réelle d'un produit depuis Firebase si nécessaire
function getProductImage(p, callback) {
  if (!p.image) { callback(null); return; }
  if (p.image.indexOf('__firebase__') === 0) {
    var refId = p._imageRef || p.id;
    db.ref('data/product_images/' + refId).once('value').then(function(snap){
      callback(snap.val() || null);
    }).catch(function(){ callback(null); });
  } else {
    callback(p.image);
  }
}
function deleteProduct(id) {
  // Track deleted IDs so merge doesn't bring them back
  var deleted = load('ba_deleted_products', []);
  if (deleted.indexOf(id) < 0) deleted.push(id);
  save('ba_deleted_products', deleted);
  // Remove from saved list
  var saved = load('ba_products', null) || DEFAULT_PRODUCTS.slice();
  saved = saved.filter(function(p){ return p.id !== id; });
  save('ba_products', saved);
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }
function fmt(p) { var n = (typeof p==='number') ? p : parseFloat(p)||0; return n.toFixed(2).replace('.',',') + '€'; }
function notifyOrder(userId, title, body, status, orderId, orderNumber, pickupTime) {
  // ONE notification via status_updates (in-app) + OneSignal (background)
  var notifId = genId();
  // Firebase real-time (in-app)
  db.ref('status_updates/'+userId+'/'+notifId).set({
    orderId: orderId,
    orderNumber: orderNumber,
    status: status,
    title: title,
    body: body,
    at: new Date().toISOString()
  });
  // OneSignal (background/push)
  osSendPush(userId, title, body, 0);
  // Save to user notifs history
  var users = getUsers();
  var u = users.find(function(x){ return x.id === userId; });
  if (u) {
    if (!u.notifs) u.notifs = [];
    u.notifs.unshift({id:notifId, title:title, body:body, read:false, at:new Date().toISOString()});
    if (u.notifs.length > 50) u.notifs = u.notifs.slice(0,50);
    saveUser(u);
  }
}

function notify(userId, title, body) {
  var users = getUsers();
  var u = users.find(function(x){ return x.id === userId; });
  if (!u) return;
  if (!u.notifs) u.notifs = [];
  var notif = {id:genId(), title:title, body:body, read:false, at:new Date().toISOString()};
  u.notifs.unshift(notif);
  if (u.notifs.length > 50) u.notifs = u.notifs.slice(0,50);
  saveUser(u);
  // Write to status_updates so client listener picks it up immediately
  db.ref('status_updates/'+userId+'/'+notif.id).set({
    orderId: '',
    orderNumber: '',
    status: 'message',
    title: title,
    body: body,
    at: notif.at
  }).catch(function(e){ console.warn('notify write error:', e); });
  // If current user is viewing app right now, show immediately
  var cur = getCurrentUser();
  if (cur && cur.id === userId) {
    toast(title + ' : ' + body, 'info', 5000);
    sendPushNotif(title, body);
  }
}
function getPalier(pts) {
  var paliers = load('ba_paliers', PALIERS);
  paliers = paliers.slice().sort(function(a,b){return (a.pts||a.min||0)-(b.pts||b.min||0);});
  var p = paliers[0];
  for (var i=0; i<paliers.length; i++) { if (pts >= (paliers[i].pts||paliers[i].min||0)) p = paliers[i]; }
  return p;
}

function toast(msg, type, dur) {
  // Defensif : un toast qui echoue ne doit JAMAIS interrompre la fonction
  // appelante (sinon la fermeture de modale qui suit n'est jamais atteinte).
  try {
    var wrap = document.getElementById('toasts');
    if (!wrap) { console.log('[toast]', msg); return; }
    var el = document.createElement('div');
    el.className = 'toast toast-' + (type||'info');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.remove(); }, dur||3200);
  } catch(e) { console.warn('[toast]', msg, e); }
}

  var cb = document.getElementById('cart-badge');
  var n = cart.reduce(function(s,i){ return s+i.qty; }, 0);
  if (cb) {

    cb.textContent=n; cb.style.display=n>0?'flex':'none';
    // Petit rebond quand le panier augmente : confirme visuellement l'ajout
    if (n > prev) {
      cb.classList.remove('badge-bounce');
      void cb.offsetWidth; // relance l'animation
      cb.classList.add('badge-bounce');

function doSendResetCode() {
  var contact = (document.getElementById('fp-contact').value||'').trim().toLowerCase();
  var err = document.getElementById('fp-err');
  if (!contact) { if(err){err.textContent='Champ requis';err.classList.add('show');} return; }

  var users = getUsers();
  var user = null;

  user = users.find(function(u){ return (u.email||'').toLowerCase() === contact; });
  if (!user) {
    var clean = contact.replace(/[^0-9]/g,'');
    if (clean.length >= 8) {
      user = users.find(function(u){
        var p = (u.phone||'').replace(/[^0-9]/g,'');
        return p === clean || p.slice(-8) === clean.slice(-8);
      });
    }
  }

  if (!user) {
    if(err){ err.textContent='Aucun compte trouv\u00e9.'; err.classList.add('show'); }
    return;
  }

  // Générer code 6 chiffres
  var code = String(Math.floor(100000 + Math.random() * 900000));
  var expiry = Date.now() + 15 * 60 * 1000; // 15 min
  db.ref('data/reset_tokens/' + user.id).set({ code: code, expiry: expiry, userId: user.id });

  var sent = false;

  // Envoyer par email si disponible
  if (user.email && typeof emailjs !== 'undefined') {
    try {
      emailjs.send(EMAILJS_SERVICE, 'template_gkowx1h', {
        email: user.email,
        client_name: user.prenom,
        reset_code: code
    });
      sent = true;
    } catch(e) {}
  }

  // Afficher la saisie du code
  showEnterResetCode(user, sent);
}

function showEnterResetCode(user, emailSent) {
  var hint = emailSent
    ? 'Un code a \u00e9t\u00e9 envoy\u00e9 \u00e0 <strong>' + user.email + '</strong>. V\u00e9rifiez vos spams.'
    : 'Code g\u00e9n\u00e9r\u00e9. Contactez-nous si vous ne le recevez pas.';

  // Fallback SMS via WhatsApp si pas d'email
  if (!emailSent && user.phone) {
    var msg = 'Break Antillais - Code de r\u00e9initialisation\n\nBonjour ' + user.prenom + ' !\nVotre code : ';
    db.ref('data/reset_tokens/' + user.id).once('value').then(function(snap){

function doVerifyResetCode(userId) {
  var code = (document.getElementById('fp-code').value||'').trim();

  if (!code || code.length !== 6) { if(err){err.textContent='Entrez le code \u00e0 6 chiffres';err.classList.add('show');} return; }

    var d = snap.val();
    if (!d) { if(err){err.textContent='Code invalide ou expir\u00e9';err.classList.add('show');} return; }
    if (Date.now() > d.expiry) {

    if (d.code !== code) { if(err){err.textContent='Code incorrect';err.classList.add('show');} return; }

function doLogin() {
  var email = (document.getElementById('li-email').value||'').trim().toLowerCase();
  var pwd = document.getElementById('li-pwd').value;
  var err = document.getElementById('li-err');
  if (!email||!pwd) { if(err){err.textContent='Champs requis';err.classList.add('show');} return; }
  var users = getUsers();
  var user = users.find(function(u){ return u.email===email && u.pwd===pwd; });
  if (user) { _finishLogin(user); return; }
  // Pas trouve dans le cache local : verifier directement dans Firebase.
  // (Les clients ne telechargent plus tout l'annuaire, donc un compte cree sur
  // un autre appareil peut ne pas etre en cache — on va le chercher a la source.)
  if(err){err.textContent='Vérification...';err.classList.remove('show');}
  db.ref('data/users').orderByChild('email').equalTo(email).once('value').then(function(snap){
    var v = snap.val();
    var found = null;
    if (v) Object.keys(v).forEach(function(k){ if(v[k] && v[k].pwd===pwd) found=v[k]; });
    if (!found) { if(err){err.textContent='Email ou mot de passe incorrect';err.classList.add('show');} return; }
    saveUser(found);
    _finishLogin(found);
  }).catch(function(){
    if(err){err.textContent='Email ou mot de passe incorrect';err.classList.add('show');}
  });
}
function _finishLogin(user) {
  var err = document.getElementById('li-err');
  var remember = document.getElementById('li-remember') && document.getElementById('li-remember').checked;
  user.lastLogin = new Date().toISOString();
  saveUser(user);
  db.ref('data/users/'+user.id+'/lastLogin').set(user.lastLogin);
  setCurrentUser(user, remember);
  closeModal('m-auth');
  updateHeaderAuth(); updateBadges();
  renderHome();
  checkBirthdayOffer(user);
  requestNotifPermission();
  // Attach notification listener for this user
  attachClientNotifListener(user);
  osSubscribe(user.id);
  // Pour les admins : recharger les commandes depuis Firebase immédiatement
  var loginIsAdmin = user.role==='superadmin'||user.role==='admin'||user.role==='entreprise'||user.role==='preparateur';
  if (loginIsAdmin) {
    db.ref('data/ba_orders').once('value').then(function(snap){
      var v = snap.val();
      if (!v) return;
      var orders = Array.isArray(v) ? v : Object.values(v).filter(function(x){ return x&&x.id; });
      try { localStorage.setItem('_ba_ba_orders', JSON.stringify(orders)); } catch(e) {}
      console.log('[BA] Admin connecté : '+orders.length+' commandes rechargées depuis Firebase');
    });
  }
  toast('Bienvenue '+user.prenom+' ! 🌴','success');
}
function doRegister() {
  var prenom = (document.getElementById('rg-p').value||'').trim();
  var phone  = (document.getElementById('rg-t').value||'').trim().replace(/\s/g,'');
  var bday   = document.getElementById('rg-b').value;
  var email  = (document.getElementById('rg-e').value||'').trim().toLowerCase();
  var pwd    = document.getElementById('rg-pw').value;
  var pwd2   = document.getElementById('rg-pw2').value;
  var cgv    = document.getElementById('rg-cgv').checked;
  document.querySelectorAll('.form-error').forEach(function(e){e.textContent='';e.classList.remove('show');});
  var ok=true;
  function setErr(id,msg){var el=document.getElementById(id);if(el){el.textContent=msg;el.classList.add('show');}ok=false;}
  if(!prenom) setErr('rg-p-e','Prenom requis');
  if(!phone||phone.length<10) setErr('rg-t-e','Numero invalide');
  if(!email||email.indexOf('@')<0) setErr('rg-e-e','Email invalide');
  if(!pwd||pwd.length<6) setErr('rg-pw-e','Min. 6 caracteres');
  if(pwd!==pwd2) setErr('rg-pw2-e','Mots de passe differents');
  if(!cgv) setErr('rg-cgv-e','Acceptez les CGV');
  if(!ok) return;
  var phoneDigits = phone.replace(/[^0-9]/g,'');
  // Verification d'unicite cote Firebase (les clients n'ont plus l'annuaire complet
  // en local, donc on interroge la source directement — plus sur ET plus fiable).
  var _rgBtn = document.getElementById('rg-submit');
  if (_rgBtn) { _rgBtn.disabled = true; _rgBtn.dataset._t = _rgBtn.textContent; _rgBtn.textContent = 'Création...'; }
  var restore = function(){ if(_rgBtn){ _rgBtn.disabled=false; _rgBtn.textContent=_rgBtn.dataset._t||'Créer mon compte'; } };
  db.ref('data/users').orderByChild('email').equalTo(email).once('value').then(function(snapE){
    if (snapE.val()) { restore(); setErr('rg-e-e','Email deja utilise'); return; }
    return db.ref('data/users').once('value').then(function(snapAll){
      var all = snapAll.val() || {};
      var phoneTaken = Object.keys(all).some(function(k){
        var u = all[k];
        return u && u.phone && u.phone.replace(/[^0-9]/g,'')===phoneDigits;
      });
      if (phoneTaken) { restore(); setErr('rg-t-e','Ce numero a deja un compte'); return; }
      _createAccount(prenom, phone, email, pwd, bday);
    });
  }).catch(function(e){
    // En cas d'echec reseau, on retombe sur la verification locale (mieux que rien)
    restore();
    var users = getUsers();
    if(users.find(function(u){return u.email===email;})){setErr('rg-e-e','Email deja utilise');return;}
    if(users.find(function(u){return u.phone && u.phone.replace(/[^0-9]/g,'')===phoneDigits;})){setErr('rg-t-e','Ce numero a deja un compte');return;}
    _createAccount(prenom, phone, email, pwd, bday);
  });
}
function _createAccount(prenom, phone, email, pwd, bday) {
  function setErr(id,msg){var el=document.getElementById(id);if(el){el.textContent=msg;el.classList.add('show');}}
  var cfg = getCfg();
  var signupPts = cfg.signupPts||20;
  var newUser = {
    id:genId(), role:'client', prenom:prenom, phone:phone,
    email:email, pwd:pwd, bday:bday||null,
    points:signupPts, notifs:[], createdAt:new Date().toISOString()
  };
  newUser.referralCode = prenom.toUpperCase().substr(0,3) + Math.random().toString(36).substr(2,4).toUpperCase();
  saveUser(newUser);
  // Save signup points history
  var initHist = [{pts:signupPts, label:'Bonus inscription', at:new Date().toISOString()}];
  save('ba_pts_history_'+newUser.id, initHist);
  // Process referral code via Firebase
  var refCode = (document.getElementById('rg-ref')||{}).value||'';
  if (refCode.trim()) {
    var refCodeUpper = refCode.trim().toUpperCase();
    // Search in Firebase directly to find parrain
    db.ref('data/users').orderByChild('referralCode').equalTo(refCodeUpper).once('value').then(function(snap) {
      var usersObj = snap.val();
      if (!usersObj) return;
      var refUser = Object.values(usersObj)[0];
      if (!refUser || refUser.id === newUser.id) return;
      var cfg2 = getCfg();
      var refBonus = cfg2.referralPtsParrain || 100;
      var filleulBonus = cfg2.referralPtsFilleul || 50;
      // Update parrain points
      refUser.points = (refUser.points||0) + refBonus;
      db.ref('data/users/'+refUser.id+'/points').set(refUser.points);
      var refHist = load('ba_pts_history_'+refUser.id, []);
      refHist.unshift({pts:refBonus, label:'Parrainage de '+prenom, at:new Date().toISOString()});
      save('ba_pts_history_'+refUser.id, refHist);
      saveUser(refUser);
      // Update filleul points
      newUser.points = (newUser.points||0) + filleulBonus;
      db.ref('data/users/'+newUser.id+'/points').set(newUser.points);
      var newHist = load('ba_pts_history_'+newUser.id, []);
      newHist.unshift({pts:filleulBonus, label:'Bonus parrainage', at:new Date().toISOString()});
      save('ba_pts_history_'+newUser.id, newHist);
      saveUser(newUser);
      notify(refUser.id, '🎉 Parrainage valide !', prenom+' a utilise votre code. +'+refBonus+' points offerts !');
      toast('Code de parrainage valide ! +'+filleulBonus+' points bonus !', 'success', 5000);
    }).catch(function(e){ console.warn('Referral error:', e); });
  }
  // Rattacher les commandes "guest" (prises par telephone) avec le meme numero,
  // et crediter retroactivement les points de celles deja recuperees.
  (function(){
    var cleanPhone = phone.replace(/[^0-9]/g, '');
    if (!cleanPhone) return;
    var cfgR = getCfg();
    var ptsPerEuro = cfgR.ptsPerEuro || 5;
    var bonusThreshold = cfgR.bonusOrderThreshold || 20;
    var bonusPts = cfgR.bonusOrderPts || 5;
    db.ref('data/ba_orders').once('value').then(function(snap){
      var v = snap.val();
      if (!v) return;
      var orders = Array.isArray(v) ? v : Object.values(v);
      var gained = 0, count = 0;
      orders.forEach(function(o){
        if (!o || !o.id) return;
        if (!(o.userId && o.userId.indexOf('guest-') === 0)) return;
        var orderPhone = (o.userPhone||'').replace(/[^0-9]/g, '');
        if (!orderPhone || orderPhone !== cleanPhone) return;
        // 1. Rattacher la commande au nouveau compte
        db.ref('data/ba_orders/'+o.id+'/userId').set(newUser.id);
        try {
          var lsOrders = JSON.parse(localStorage.getItem('_ba_ba_orders')||'[]');
          var arr = Array.isArray(lsOrders) ? lsOrders : Object.values(lsOrders);
          var i = arr.findIndex(function(x){ return x && x.id === o.id; });
          if (i >= 0) { arr[i].userId = newUser.id; localStorage.setItem('_ba_ba_orders', JSON.stringify(arr)); }
        } catch(e) {}
        count++;
        // 2. Crediter les points si la commande a ete recuperee et pas encore creditee
        if (o.status === 'picked_up' && o.pointsAwarded !== true) {
          var pts = Math.floor(o.total || 0) * ptsPerEuro;
          var bonus = (o.total || 0) >= bonusThreshold ? bonusPts : 0;
          gained += pts + bonus;
          db.ref('data/ba_orders/'+o.id+'/pointsAwarded').set(true);
        }
      });
      if (gained > 0) {
        newUser.points = (newUser.points||0) + gained;

        save('ba_pts_history_'+newUser.id, hist);

          toast('🎁 '+gained+' points de vos commandes précédentes ont été ajoutés !', 'success', 6000);
          if (typeof renderHome === 'function') renderHome();

    }).catch(function(e){ console.warn('Rattachement commandes:', e); });
  })();

function renderHome() {

  var todayClosed = closedDates.find(function(c){ return c.date === todayStr; });

    if (openDays.indexOf(cDay) >= 0 && cDate > now) {

  else html += '<div style="font-weight:700;font-size:.95rem;color:var(--red)">🌴 Specialites Antillaises</div>';

      +'</span>';
  }
  html += '</div>';
  html += '<div style="font-size:.74rem;color:var(--muted);margin-top:.3rem">Bokit · Agoulou · Crepes — Retrait '+cfg.start+'–'+cfg.end+'</div>';
  html += '</div>'; // close hero
  // Not a work day message
  if (!isWorkDay) {
    var dayNames = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    var nextWorkDay = null;
    for (var d=1;d<=7;d++) {

  }

  if (upcomingClosure) {
    var ucDate = new Date(upcomingClosure.date);

      html += '<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:.45rem .85rem;margin-top:.5rem;font-size:.75rem;color:#f59e0b;display:inline-block">'

      +'<div style="font-size:.75rem;color:var(--muted)">Inscrivez-vous et recevez '+(getCfg().signupPts||20)+' points offerts</div></div>'
      +'<button class="btn btn-primary btn-sm" onclick="showRegister()">S&apos;inscrire</button>'

  var hasFeatured = prods.some(function(p){ return p.featured || (freq[p.name]&&freq[p.name]>=2); });

  var cats = [];
  if(hasFeatured) cats.push({k:'featured',l:'⭐ Top'});
  cats = cats.concat([{k:'bokit',l:'🫓 Bokits'},{k:'agoulou',l:'🌯 Agoulou'},{k:'crepe_salee',l:'🥞 Crepes Salee'},{k:'crepe_sucree',l:'🍫 Crepes Sucree'},{k:'mini_bokit',l:'📦 Box Mini'},{k:'enfant',l:'🧒 Enfants'},{k:'enfant_agoulou',l:'🌯🧒 Enfant Agoulou'},{k:'boisson',l:'🥤 Boissons'}]);

function filterCat(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  var g = document.getElementById('pgrid');
  if (!g) return;
  var allProds = getProducts();
  var prods;
  if (cat === 'featured') {
    var orders = getOrders().filter(function(o){ return o.status==='picked_up'; });
    var freq = {};
    orders.forEach(function(o){ (o.items||[]).forEach(function(i){ if(i.cat!=='boisson'&&i.cat!=='reward') freq[i.name]=(freq[i.name]||0)+1; }); });
    prods = allProds.filter(function(p){ return p.featured || (freq[p.name]&&freq[p.name]>=2); });
    prods.sort(function(a,b){ return ((freq[b.name]||0)+(b.featured?100:0)) - ((freq[a.name]||0)+(a.featured?100:0)); });
  } else {
    prods = allProds.filter(function(p){ return p.cat===cat; });
    prods.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','fr'); });
  }
  g.innerHTML = prods.length ? prods.map(pcardHTML).join('') : '<div class="empty-state" style="padding:2rem 0"><div class="icon">📭</div><p class="text-sm">Aucun produit dans cette categorie</p></div>';
  setTimeout(loadProductImages, 200);
}
function pcardHTML(p) {

  var clickable = p.ok && !p.soon && !stockEmpty;
  var cls = 'pcard' + (clickable ? '' : ' unavail');
  var _imgSrc = p.image && p.image.indexOf('__firebase__') === 0 ? null : p.image;
  var _imgId = 'pimg-' + p.id;
  var _tint = {bokit:'#242018',agoulou:'#1e2420',crepe_salee:'#20221a',crepe_sucree:'#251d20',boisson:'#1a2024',mini_bokit:'#231f1a',enfant:'#22201a',enfant_agoulou:'#1e2420'}[p.cat] || 'var(--dark4)';
  var imgHtml = _imgSrc
    ? '<div class="pcard-img"><img src="'+_imgSrc+'" id="'+_imgId+'" alt="'+p.name+'"/></div>'
    : (p.image && p.image.indexOf('__firebase__') === 0)
      ? '<div class="pcard-img" id="pwrap-'+p.id+'" style="background:'+_tint+'">'+(EMOJI[p.cat]||'\uD83C\uDF7D')+'</div>'
      : '<div class="pcard-img" style="background:'+_tint+'">'+(EMOJI[p.cat]||'\uD83C\uDF7D')+'</div>';
  var allergenBadge = (p.allergens && p.allergens.length)
    ? '<div style="font-size:.66rem;color:#f59e0b;margin-top:.25rem">\u26a0 '+p.allergens.join(', ')+'</div>'
    : '';
  var user = getCurrentUser();
  var favs = user ? load('ba_favs_'+user.id, []) : [];
  var isFav = favs.indexOf(p.id) >= 0;
  var favBtn = (clickable && user)
    ? '<button class="pcard-fav" data-fid="'+p.id+'" onclick="event.stopPropagation();toggleFav(this.dataset.fid,this)">'+(isFav?'\u2764\uFE0F':'\uD83E\uDD0D')+'</button>'
    : '';
  var priceHtml = p.isClassique
    ? '<span class="pcard-price" style="font-size:.76rem;color:var(--muted);font-family:var(--body);font-weight:600">Selon selection</span>'
    : '<span class="pcard-price">'+fmt(p.price||0)+'</span>';
  var epuise = stockEmpty || (!p.ok && !p.soon && p.stock === 0);
  var clickAttr = clickable ? ' data-pid="'+p.id+'" onclick="openProduct(this.dataset.pid)"' : '';
  var addBtn = clickable
    ? '<button class="pcard-add" data-pid="'+p.id+'" onclick="event.stopPropagation();openProduct(this.dataset.pid)" aria-label="Choisir '+p.name+'">+</button>'
    : '';
  return '<div class="'+cls+'"'+clickAttr+'>'
    + imgHtml
    + (p.soon ? '<span class="soon-badge">Bientot</span>' : '')
    + (epuise ? '<span class="soon-badge" style="background:#6b7280">Épuisé</span>' : '')
    + favBtn
    + '<div class="pcard-body">'
    + '<div class="pcard-name">'+p.name+'</div>'
    + '<div class="pcard-desc">'+(p.desc||'')+'</div>'
    + allergenBadge
    + '<div class="pcard-foot">'+priceHtml+addBtn+'</div>'
    + '</div></div>';
}

function boxAdjust(btn, delta) {
  var idx = parseInt(btn.dataset.idx);
  var maxSav = parseInt(btn.dataset.max);
  var totalQty = parseInt(btn.dataset.total);
  var qps = parseInt(btn.dataset.qps); // qty per saveur = 5
  var current = _boxQtys[idx] || 0; // nombre de fois cette saveur (en packs de 5)
  var activeSaveurs = Object.keys(_boxQtys).filter(function(k){ return (_boxQtys[k]||0)>0; }).length;
  var totalPcs = Object.values(_boxQtys).reduce(function(s,v){return s+(v||0)*qps;},0);

  if (delta > 0) {
    if (current === 0 && activeSaveurs >= maxSav) { toast('Maximum '+maxSav+' saveurs differentes pour cette box','warning'); return; }
    if (totalPcs + qps > totalQty) { toast('Box complete ('+totalQty+' pcs)','warning'); return; }
    _boxQtys[idx] = current + 1;
  } else {
    if (current <= 0) return;
    _boxQtys[idx] = current - 1;
  }

  var newCount = _boxQtys[idx];
  var el = document.getElementById('box-qty-'+idx);
  if (el) el.textContent = newCount > 0 ? newCount+'x ('+newCount*qps+' pcs)' : '0';
  var row = document.getElementById('box-row-'+idx);
  if (row) row.style.borderColor = newCount > 0 ? 'var(--red)' : 'var(--border)';
  var newTotal = Object.values(_boxQtys).reduce(function(s,v){return s+(v||0)*qps;},0);
  var totalEl = document.getElementById('box-total');
  if (totalEl) totalEl.textContent = newTotal+' / '+totalQty;
}


function toggleBoxSaveur10(idx) {
  idx = parseInt(idx);
  var current = _boxQtys[idx] || 0;
  var activeSaveurs = Object.keys(_boxQtys).filter(function(k){ return (_boxQtys[k]||0) > 0; }).length;
  if (current > 0) {
    _boxQtys[idx] = 0;
    document.getElementById('box-qty-'+idx).textContent = '—';
    document.getElementById('box-check-'+idx).style.background = 'transparent';
    document.getElementById('box-check-'+idx).style.borderColor = 'var(--border)';
    document.getElementById('box-row-'+idx).style.borderColor = 'var(--border)';
  } else {
    if (activeSaveurs >= 2) { toast('Maximum 2 saveurs pour cette box','warning'); return; }
    _boxQtys[idx] = 5;
    document.getElementById('box-qty-'+idx).textContent = '5 mini';
    document.getElementById('box-check-'+idx).style.background = 'var(--red)';
    document.getElementById('box-check-'+idx).style.borderColor = 'var(--red)';
    document.getElementById('box-row-'+idx).style.borderColor = 'var(--red)';
  }
  var active = Object.keys(_boxQtys).filter(function(k){ return (_boxQtys[k]||0)>0; }).length;
  document.getElementById('box-total').textContent = active+' / 2';
}

function adjustBoxSaveur(idx, delta, maxSaveurs, totalQty, qtyPerSaveur) {
  idx = parseInt(idx);
  if (!_boxQtys[idx]) _boxQtys[idx] = 0;
  var currentTotal = Object.values(_boxQtys).reduce(function(s,v){return s+v;},0);
  if (delta > 0 && currentTotal >= maxSaveurs) {
    toast('Maximum '+maxSaveurs+' saveurs pour cette box','warning'); return;
  }
  if (delta < 0 && _boxQtys[idx] <= 0) return;
  _boxQtys[idx] = (_boxQtys[idx]||0) + delta;
  if (_boxQtys[idx] < 0) _boxQtys[idx] = 0;
  // Update display
  var el = document.getElementById('box-qty-'+idx);
  if (el) el.textContent = _boxQtys[idx] > 0 ? _boxQtys[idx]+'x ('+(_boxQtys[idx]*qtyPerSaveur)+' pcs)' : '0';
  var row = document.getElementById('box-row-'+idx);
  if (row) row.style.borderColor = _boxQtys[idx]>0 ? 'var(--red)' : 'var(--border)';
  // Update total
  var newTotal = Object.values(_boxQtys).reduce(function(s,v){return s+v;},0);
  var totalEl = document.getElementById('box-total');
  if (totalEl) totalEl.textContent = newTotal+' / '+maxSaveurs;
}

function adjustBoxQty(idx, delta, maxSav, totalQty) {
  idx = parseInt(idx);
  var current = _boxQtys[idx] || 0;
  var totalUsed = Object.values(_boxQtys).reduce(function(s,v){ return s+(v||0); }, 0);
  var activeSaveurs = Object.keys(_boxQtys).filter(function(k){ return (_boxQtys[k]||0)>0; }).length;
  var newVal = current + delta;
  if (newVal < 0) return;
  if (delta > 0) {
    if (current === 0 && activeSaveurs >= maxSav) { toast('Maximum '+maxSav+' saveurs pour cette box','warning'); return; }
    if (totalUsed >= totalQty) { toast('Maximum '+totalQty+' mini bokits atteint','warning'); return; }
  }
  _boxQtys[idx] = newVal;
  var el = document.getElementById('box-qty-'+idx);
  if (el) el.textContent = newVal+'';
  var row = document.getElementById('box-row-'+idx);
  if (row) row.style.borderColor = newVal > 0 ? 'var(--red)' : 'var(--border)';
