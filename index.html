  var m = document.getElementById('m-product');
  var items = o.items || [];
  var isPreparing = (o.status === 'preparing');
  var itemsStatus = o.itemsStatus || {};

  // ── Compteur d'articles prêts ──
  var doneCount = 0;
  items.forEach(function(_, i){ if (itemsStatus[i] === 'done') doneCount++; });

  // ── Liste des articles ──
  var itemsHtml = '';
  items.forEach(function(it, i) {
    var isDone = itemsStatus[i] === 'done';
    var dets = it.details ? it.details.split('|').map(function(d){ return d.trim(); }).filter(Boolean) : [];

    itemsHtml += '<div id="prep-item-'+i+'" style="background:'+(isDone?'rgba(16,185,129,.1)':'var(--dark3)')+';'
      + 'border:2px solid '+(isDone?'#10b981':'rgba(255,255,255,.06)')+';'
      + 'border-radius:12px;padding:.85rem 1rem;margin-bottom:.55rem;transition:all .25s">'
      + '<div style="display:flex;align-items:center;gap:.65rem">'
      // Numéro / check
      + '<div style="background:'+(isDone?'#10b981':'var(--red)')+';color:#fff;font-family:var(--head);font-weight:900;'
      + 'font-size:1rem;min-width:30px;height:30px;border-radius:50%;'
      + 'display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .25s">'
      + (isDone ? '✓' : (i+1))+'</div>'
      // Nom + détails
      + '<div style="flex:1">'
      + '<div style="font-family:var(--head);font-weight:800;font-size:1.05rem;line-height:1.3'+(isDone?';text-decoration:line-through;opacity:.6':'')+'">'+it.name+'</div>';
    dets.forEach(function(d){
      itemsHtml += '<div style="font-size:.82rem;color:#f59e0b;font-weight:600;margin-top:.15rem">→ '+d+'</div>';
    });
    itemsHtml += '</div>'
      // Prix
      + '<div style="text-align:right;flex-shrink:0">'
      + '<div style="font-weight:700;color:var(--gold);font-size:.9rem">'+fmt(it.price||0)+'</div>';
    // Bouton Prêt (visible seulement en mode préparation)
    if (isPreparing && !isDone) {
      itemsHtml += '<button class="btn btn-sm" style="margin-top:.3rem;background:rgba(16,185,129,.15);'
        + 'border:1px solid #10b981;color:#10b981;font-size:.75rem;padding:.25rem .6rem"'
        + ' data-oid="'+o.id+'" data-idx="'+i+'" onclick="prepMarkItem(this.dataset.oid,this.dataset.idx)">'
        + '✅ Prêt</button>';
    } else if (isDone) {
      itemsHtml += '<div style="color:#10b981;font-size:.75rem;font-weight:700;margin-top:.2rem">Prêt ✓</div>';
    }
    itemsHtml += '</div></div></div>';
  });

  // ── Barre de progression ──
  var pct = items.length ? Math.round(doneCount/items.length*100) : 0;
  var progressHtml = isPreparing
    ? '<div style="margin-bottom:.85rem">'
      + '<div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:.3rem">'
      + '<span style="font-weight:700">Progression</span>'
      + '<span style="color:'+(pct===100?'#10b981':'#f59e0b')+';font-weight:800">'+doneCount+'/'+items.length+'</span>'
      + '</div>'
      + '<div style="background:var(--dark4);border-radius:100px;height:8px">'
      + '<div style="background:'+(pct===100?'#10b981':'var(--red)')+';border-radius:100px;height:8px;width:'+pct+'%;transition:width .3s"></div>'
      + '</div></div>'
    : '';

  // ── Boutons bas ──
  var bottomHtml;
  if (!isPreparing) {
    // Vue initiale : Annuler + Confirmer
    bottomHtml = '<div style="display:flex;gap:.5rem;margin-top:.75rem">'
      + '<button class="btn btn-secondary" style="flex:1" onclick="closeModal(&apos;m-product&apos;)">Annuler</button>'
      + '<button class="btn btn-primary" style="flex:2" data-oid="'+o.id+'"'
      + ' onclick="prepStart(this.dataset.oid)">✅ Confirmer et démarrer</button>'
      + '</div>';
  } else if (doneCount === items.length) {
    // Tout prêt → bouton passer en Prête
    bottomHtml = '<div style="margin-top:.75rem">'
      + '<button class="btn btn-primary btn-full" style="background:#10b981;border-color:#10b981;font-size:1rem;padding:.9rem"'
      + ' data-oid="'+o.id+'" onclick="prepFinish(this.dataset.oid)">'
      + '🎉 Tout est prêt — Avertir le client !</button>'
      + '</div>';
  } else {
    // En cours
    bottomHtml = '<div style="display:flex;gap:.5rem;margin-top:.75rem">'
      + '<button class="btn btn-secondary btn-full" onclick="closeModal(&apos;m-product&apos;)">Réduire</button>'
      + '</div>';
  }

  var html = '<div class="modal-overlay" onclick="if(event.target===this)closeModal(&apos;m-product&apos;)">'
    + '<div class="modal" id="prep-modal-inner" style="max-height:92vh;overflow-y:auto">'
    + '<div class="modal-handle"></div>'
    // En-tête
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem">'
    + '<div>'
    + '<div style="font-family:var(--head);font-weight:900;font-size:1.25rem;color:var(--red)">🍳 Préparation</div>'
    + '<div style="font-size:.82rem;color:var(--muted)">N°'+o.orderNumber+' · '+o.userPrenom+'</div>'
    + '</div>'
    + '<div style="text-align:right">'
    + '<div style="font-family:var(--head);font-weight:800;font-size:1.1rem;color:#f59e0b">⏰ '+o.pickupTime+'</div>'
    + '<div style="font-size:.72rem;color:var(--muted)">'+(o.userPhone||'')+'</div>'
    + '</div></div>'
    // Résumé
    + '<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);'
    + 'border-radius:10px;padding:.5rem .85rem;margin-bottom:.75rem;'
    + 'display:flex;align-items:center;justify-content:space-between">'
    + '<span style="font-weight:700;font-size:.9rem">'+items.length+' article'+(items.length>1?'s':'')+' à préparer</span>'
    + '<span style="color:var(--gold);font-weight:800">'+fmt(o.total||0)+'</span>'
    + '</div>'
    + progressHtml
    + itemsHtml
    + bottomHtml
    + '</div></div>';

  m.innerHTML = html;
  m.style.display = 'block';
}

// Démarrer la préparation et rester dans la modale
function prepStart(orderId) {
  var btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Démarrage...'; }
  db.ref('data/ba_orders/' + orderId).once('value').then(function(snap) {
    var o = snap.val();
    if (!o) { o = getOrders().find(function(x){ return x.id===orderId; }); }
    o.status = 'preparing';
    o.updatedAt = new Date().toISOString();
    o.itemsStatus = {};
    saveOrder(o);
    db.ref('data/ba_orders/'+o.id).set(o);
    notifyOrder(o.userId, '👨‍🍳 En preparation', 'Votre commande est en preparation.', 'preparing', o.id, o.orderNumber, o.pickupTime);
    // Recharger la modale en mode préparation
    _renderPrepModal(o);
  }).catch(function(e){ toast('Erreur: '+e.message, 'error'); });
}

// Marquer un article comme prêt
function prepMarkItem(orderId, itemIdx) {
  var btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  db.ref('data/ba_orders/' + orderId).once('value').then(function(snap) {
    var o = snap.val();
    if (!o) { o = getOrders().find(function(x){ return x.id===orderId; }); }
    if (!o.itemsStatus) o.itemsStatus = {};
    o.itemsStatus[parseInt(itemIdx)] = 'done';
    o.updatedAt = new Date().toISOString();
    saveOrder(o);
    db.ref('data/ba_orders/'+o.id+'/itemsStatus').set(o.itemsStatus);
    // Vérifier si tout est prêt
    var items = o.items || [];
    var allDone = items.every(function(_, i){ return o.itemsStatus[i] === 'done'; });
    if (allDone) {
      // Passer automatiquement en ready
      prepFinishOrder(o);
    } else {
      _renderPrepModal(o);
    }
  }).catch(function(e){ if(btn){btn.disabled=false;btn.textContent='✅ Prêt';} toast('Erreur','error'); });
}

// Bouton "Tout est prêt" manuel
function prepFinish(orderId) {
  db.ref('data/ba_orders/' + orderId).once('value').then(function(snap) {
    var o = snap.val();
    if (!o) { o = getOrders().find(function(x){ return x.id===orderId; }); }
    prepFinishOrder(o);
  });
}

// Passer en ready et fermer la modale
function prepFinishOrder(o) {
  o.status = 'ready';
  o.updatedAt = new Date().toISOString();
  saveOrder(o);
  db.ref('data/ba_orders/'+o.id).set(o);
  notifyOrder(o.userId, '🎉 Prete !', 'Votre commande est prete ! Venez la recuperer.', 'ready', o.id, o.orderNumber, o.pickupTime);
  closeModal('m-product');
  toast('🎉 Commande prête ! Client averti.', 'success', 4000);
  var ac = adminContentEl();
  if (ac) ac.innerHTML = adminOrders();
}


function advanceOrder(id) {
  db.ref('data/ba_orders/' + id).once('value').then(function(snap) {
    var o = snap.val();
    if (!o) {
      var local = getOrders().find(function(x) { return x.id === id; });
      if (!local) { toast('Commande introuvable', 'error'); return; }
      o = local;
    }

    var next = { pending:'confirmed', confirmed:'preparing', preparing:'ready', ready:'picked_up' };
    var nxt = next[o.status];
    if (!nxt) { toast('Statut invalide', 'error'); return; }

    o.status = nxt;
    o.updatedAt = new Date().toISOString();

    // ══ POINTS FIDÉLITÉ ══
    // Déclenché UNIQUEMENT au passage en picked_up, une seule fois (pointsAwarded flag)
    if (nxt === 'picked_up') {
      if (o.pointsAwarded === true) {
        // Sécurité anti-doublon : déjà attribués, on ignore
        console.log('[Points] Déjà attribués pour commande', o.orderNumber);
      } else if (!o.userId || o.userId.indexOf('guest-') === 0) {
        console.log('[Points] Commande guest, pas de points');
      } else {
        // Marquer IMMÉDIATEMENT avant tout appel async pour éviter le doublon
        o.pointsAwarded = true;


        var cfg = getCfg();
        var ptsPerEuro = cfg.ptsPerEuro || 5;
        var pts = Math.floor(o.total || 0) * ptsPerEuro;
        var bonus = (o.total || 0) >= (cfg.bonusOrderThreshold || 20) ? (cfg.bonusOrderPts || 5) : 0;
        var totalPts = pts + bonus;

        console.log('[Points] Calcul : ' + fmt(o.total||0) + ' × ' + ptsPerEuro + ' = ' + pts + ' pts + ' + bonus + ' bonus = ' + totalPts + ' pts');

        // Fonction qui reçoit le user et applique les points
        var awardTo = function(u) {
          if (!u || !u.id) { console.warn('[Points] User invalide'); return; }
          var before = u.points || 0;
          u.points = before + totalPts;
          console.log('[Points] ' + u.prenom + ' : ' + before + ' → ' + u.points + ' pts');

          // 1. Écrire les points dans Firebase (les deux nœuds)
          db.ref('data/users/' + u.id + '/points').set(u.points);
          db.ref('data/users/' + u.id).once('value').then(function(us){
            // update sans écraser tout le profil
          });

          // 2. Mettre à jour dans ba_users aussi
          db.ref('data/ba_users').once('value').then(function(buSnap){
            var arr = buSnap.val() || [];
            var list = Array.isArray(arr) ? arr : Object.values(arr);
            var i2 = list.findIndex(function(x){ return x && x.id === u.id; });
            if (i2 >= 0) { list[i2].points = u.points; db.ref('data/ba_users').set(list); }
          });

          // 3. Historique points Firebase
          var histEntry = { pts: totalPts, label: 'Commande N°' + o.orderNumber + ' (' + ptsPerEuro + ' pts/€)', at: new Date().toISOString() };
          db.ref('data/ba_pts_history_' + u.id).once('value').then(function(hs){
            var hArr = hs.val() || [];
            if (!Array.isArray(hArr)) hArr = Object.values(hArr);
            hArr.unshift(histEntry);
            db.ref('data/ba_pts_history_' + u.id).set(hArr.slice(0, 50));
          });

          // 4. Mettre à jour localStorage
          try {
            var lsUsers = JSON.parse(localStorage.getItem('_ba_ba_users') || '[]');
            var lu = Array.isArray(lsUsers) ? lsUsers : Object.values(lsUsers);
            var li = lu.findIndex(function(x){ return x && x.id === u.id; });
            if (li >= 0) { lu[li].points = u.points; localStorage.setItem('_ba_ba_users', JSON.stringify(lu)); }
          } catch(e) {}

          // 5. Notification client
          var msg = '+' + totalPts + ' points' + (bonus > 0 ? ' (dont +' + bonus + ' bonus)' : '') + ' ajoutés !';
          notify(o.userId, '🎁 Points ajoutés !', msg);
          db.ref('status_updates/' + o.userId + '/palier-check').set({ status: 'check_palier', pts: totalPts, at: new Date().toISOString() });
        };

        // Chercher le user : data/users → localStorage → data/ba_users
        db.ref('data/users/' + o.userId).once('value').then(function(usnap) {
          var u = usnap.val();
          if (u && u.id) {
            awardTo(u);
          } else {
            var local = getUsers().find(function(x){ return x.id === o.userId; });
            if (local) {
              awardTo(local);
            } else {
              db.ref('data/ba_users').once('value').then(function(buSnap){
                var buArr = buSnap.val() || [];
                var list = Array.isArray(buArr) ? buArr : Object.values(buArr);
                var found = list.find(function(x){ return x && x.id === o.userId; });
                if (found) {
                  db.ref('data/users/' + found.id).set(found); // migrer
                  awardTo(found);
                } else {
                  console.warn('[Points] User introuvable userId:', o.userId);
                }
              });
            }
          }
        });
      }
    }

    // Sauvegarder la commande (avec pointsAwarded=true si applicable)
    db.ref('data/ba_orders/' + o.id).set(o).then(function() {
      toast('Statut mis à jour ✓', 'success');
      var orders = getOrders();
      var idx2 = orders.findIndex(function(x) { return x.id === o.id; });
      if (idx2 >= 0) orders[idx2] = o; else orders.push(o);
      try { localStorage.setItem('_ba_ba_orders', JSON.stringify(orders)); } catch(e) {}
      var ac = adminContentEl();
      if (ac) ac.innerHTML = adminOrders();
    }).catch(function(e) {
      toast('Erreur: ' + e.message, 'error');
    });

    // Notifications statut
    var titles = { confirmed:'✅ Confirmee', preparing:'👨‍🍳 En preparation', ready:'🎉 Prete !', picked_up:'✅ Recuperee' };
    var bodies = {
      confirmed: 'Votre commande est confirmee. Retrait a ' + o.pickupTime + '.',
      preparing: 'Votre commande est en preparation.',
      ready: 'Votre commande est prete ! Venez la recuperer.',
      picked_up: 'Commande recuperee. Merci ! 🌴'
    };
    notifyOrder(o.userId, titles[nxt], bodies[nxt], nxt, o.id, o.orderNumber, o.pickupTime);

    if (nxt === 'picked_up') {
      setTimeout(function() {
        db.ref('status_updates/' + o.userId + '/rating-' + o.id).set({
          status: 'rate_order', orderId: o.id, orderNumber: o.orderNumber,
          title: 'Comment etait votre commande ?',
          body: 'Donnez votre avis sur votre derniere commande !',
          at: new Date().toISOString()
        });
      }, 25 * 60 * 1000);
    }
  }).catch(function(e) {
    toast('Erreur Firebase: ' + e.message, 'error');
  });
}


function cancelOrder(id) {
  _manualOrderMode = false;
  // Chercher dans Firebase directement par ID
  db.ref('data/ba_orders/' + id).once('value').then(function(snap) {
    var o = snap.val();
    if (!o) {
      var local = getOrders().find(function(x) { return x.id === id; });
      if (!local) { toast('Commande introuvable', 'error'); return; }
      o = local;
    }
    // Afficher la modale de confirmation
    var m = document.getElementById('m-product');
    var cancelHtml = '<div class="modal-overlay" onclick="if(event.target===this)closeModal(&apos;m-product&apos;)">'
      + '<div class="modal"><div class="modal-handle"></div>'
      + '<h2 class="modal-title">Annuler la commande N&deg;' + o.orderNumber + ' ?</h2>'
      + '<p class="text-sm text-muted mb-2">Client : ' + o.userPrenom + ' &mdash; ' + fmt(o.total || 0) + '</p>'
      + '<div class="form-group"><label class="form-label">Raison (optionnel)</label>'
      + '<input class="form-input" id="cancel-reason" placeholder="Ex: client absent, rupture stock..."/></div>'
      + '<button class="btn btn-danger btn-full mt-2" data-cid="' + o.id + '" onclick="confirmCancelOrder(this.dataset.cid)">Confirmer annulation</button>'
      + '<button class="btn btn-secondary btn-full mt-1" onclick="closeModal(&apos;m-product&apos;)">Retour</button>'
      + '</div></div>';
    m.innerHTML = cancelHtml;
    m.style.display = 'block';
  }).catch(function(e) {
    toast('Erreur: ' + e.message, 'error');
  });
}

function confirmCancelOrder(id) {
  var reason = (document.getElementById('cancel-reason') || {}).value || '';
  // Chercher dans Firebase par ID
  db.ref('data/ba_orders/' + id).once('value').then(function(snap) {
    var o = snap.val();
    if (!o) {
      var local = getOrders().find(function(x) { return x.id === id; });
      if (!local) { toast('Commande introuvable', 'error'); return; }
      o = local;
    }
    o.status = 'cancelled';
    o.cancelReason = reason;
    o.cancelledAt = new Date().toISOString();

    // Sauvegarder dans Firebase par ID
    db.ref('data/ba_orders/' + o.id).set(o).then(function() {
      // Mettre à jour localStorage
      var orders = getOrders();
      var idx = orders.findIndex(function(x) { return x.id === o.id; });
      if (idx >= 0) orders[idx] = o; else orders.push(o);
      try { localStorage.setItem('_ba_ba_orders', JSON.stringify(orders)); } catch(e) {}
      notify(o.userId, '❌ Commande annulee', 'Votre commande a ete annulee.' + (reason ? ' Raison: ' + reason : ''));
      closeModal('m-product');
      toast('Commande N°' + o.orderNumber + ' annulee', 'info');
      var ac = adminContentEl();
      if (ac) ac.innerHTML = adminOrders();
    }).catch(function(e) {
      toast('Erreur: ' + e.message, 'error');
    });
  }).catch(function(e) {
    toast('Erreur Firebase: ' + e.message, 'error');
  });
}

function adminProducts(){
  var prods=getProducts();
  var CAT_ORDER=['bokit','agoulou','crepe_salee','crepe_sucree','mini_bokit','enfant','enfant_agoulou','boisson'];
  var CAT_LABELS={bokit:'🫓 Bokits',agoulou:'🌯 Agoulous',crepe_salee:'🥞 Crêpes Salées',crepe_sucree:'🍫 Crêpes Sucrées',mini_bokit:'📦 Box Mini Bokits',enfant:'🧒 Menus Enfants',enfant_agoulou:'🌯🧒 Menus Enfant Agoulou',boisson:'🥤 Boissons'};
  var html='<div style="padding:0 .9rem">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin:.75rem 0">'
    +'<span class="font-head fw-800" style="font-size:1.1rem">Produits ('+prods.length+')</span>'
    +'<button class="btn btn-primary btn-sm" onclick="showAddProduct()">+ Ajouter</button></div>';
  // Regrouper par categorie
  var groups={};
  prods.forEach(function(p){ var k=p.cat||'autre'; (groups[k]=groups[k]||[]).push(p); });
  var keys=CAT_ORDER.filter(function(k){ return groups[k]; })
    .concat(Object.keys(groups).filter(function(k){ return CAT_ORDER.indexOf(k)<0; }).sort());
  keys.forEach(function(k){
    var list=groups[k];
    list.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','fr'); });
    var dispo=list.filter(function(p){ return p.ok && !p.soon; }).length;
    html+='<div style="display:flex;align-items:center;gap:.5rem;margin:1.1rem 0 .5rem">'
      +'<span class="font-head fw-800" style="font-size:.9rem">'+(CAT_LABELS[k]||k)+'</span>'
      +'<span style="font-size:.7rem;color:var(--muted);background:rgba(255,255,255,.05);border-radius:100px;padding:.1rem .55rem">'+dispo+'/'+list.length+' actifs</span>'
      +'<div style="flex:1;height:1px;background:var(--border)"></div></div>';
    // Stock partage : un seul stock pour toute la categorie
    if (SHARED_STOCK_CATS[k]) {
      var sh=null;
      list.forEach(function(p){ if(p.stock!==null&&p.stock!==undefined) sh=p.stock; });
      html+='<div style="background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.25);border-radius:var(--radius-sm);padding:.5rem .75rem;margin-bottom:.5rem;font-size:.75rem;color:var(--gold)">'
        +'📦 Stock partagé : '+(sh===null?'illimité':sh+' restant'+(sh>1?'s':''))+' — commun aux '+list.length+' variantes'
        +'</div>';
    }
    list.forEach(function(p){
      html+='<div class="card mb-1" style="display:flex;align-items:center;gap:.75rem">'
        +(p.image?'<img src="'+p.image+'" style="width:46px;height:46px;object-fit:cover;border-radius:8px">'
                 :'<div style="font-size:1.8rem;width:46px;text-align:center">'+(EMOJI[p.cat]||'🍽')+'</div>')
        +'<div style="flex:1;min-width:0"><div class="fw-700 text-sm">'+p.name+'</div><div class="text-sm text-gold">'+fmt(p.price||0)+'</div>'
        +(p.soon?'<div style="font-size:.68rem;color:var(--red)">Prochainement</div>':'')
        +(!SHARED_STOCK_CATS[p.cat]&&p.stock!==null&&p.stock!==undefined?'<div style="font-size:.68rem;color:'+(p.stock<=(p.stockAlert||3)?'#f59e0b':'var(--muted)')+'">Stock : '+p.stock+'</div>':'')
        +'</div>'
        +'<div style="display:flex;flex-direction:column;gap:.3rem;align-items:flex-end">'
        +'<label style="display:flex;align-items:center;gap:.3rem;cursor:pointer;font-size:.75rem">'
        +'<input type="checkbox"'+(p.ok&&!p.soon?' checked':'')+' data-pid="'+p.id+'" onchange="toggleProd(this)" style="accent-color:var(--red)"> Dispo</label>'
        +'<div style="display:flex;gap:.25rem">'
        +'<button class="btn btn-secondary btn-sm" data-pid="'+p.id+'" onclick="editProduct(this.dataset.pid)" style="font-size:.7rem;padding:.3rem .5rem">✏️</button>'
        +'<button class="btn btn-danger btn-sm" data-pid="'+p.id+'" onclick="deleteProd(this.dataset.pid)" style="font-size:.7rem;padding:.3rem .5rem">🗑</button>'
        +'</div></div></div>';
    });
  });
  return html+'</div>';
}

function toggleProd(input){
  var prods=getProducts();
  var p=prods.find(function(x){return x.id===input.dataset.pid;});
  if(p){
    p.ok=input.checked;
    if(input.checked) p.soon=false; // unset coming soon if enabling

    +'<input class="form-input" id="pf-stock-alert" type="number" min="0" placeholder="Alerte à" value="'+(stockAlert||3)+'" style="flex:1"/>'

function previewImg(input){
  var f=input.files[0]; if(!f) return;
  // Lire et compresser l'image
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // Compression : max 900px, qualite 80%
      var MAX = 900;
      var w = img.width, h = img.height;
      if (w > h) { if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} } else { if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.80);
      // Stocker l'image compressée en base64
      _newImg = dataUrl;
      // Afficher l'apercu
      var prev = document.getElementById('pf-prev');
      if (prev) {
        if (prev.tagName==='IMG') prev.src = dataUrl;
        else prev.outerHTML = '<img id="pf-prev" src="'+dataUrl+'" style="width:100%;height:110px;object-fit:cover;border-radius:8px;margin-top:.4rem">';
      }
      toast('Photo prête ! Cliquez Enregistrer.','success',2000);
    };
    img.onerror = function(){
      // Fallback sans compression
      _newImg = e.target.result;
      toast('Photo prête !','success',1500);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

function getProdFormData(){
  var n = document.getElementById('pf-n');
  var c = document.getElementById('pf-c');
  var p = document.getElementById('pf-p');
  var d = document.getElementById('pf-d');
  var ok = document.getElementById('pf-ok');
  var soon = document.getElementById('pf-soon');
  var stockEl = document.getElementById('pf-stock');
  var stockAlertEl = document.getElementById('pf-stock-alert');
  var data = {
    name: n ? n.value.trim() : '',
    cat: c ? c.value : 'bokit',
    price: p ? (parseFloat(p.value)||0) : 0,
    desc: d ? d.value.trim() : '',
    ok: ok ? ok.checked : true,
    soon: soon ? soon.checked : false,
    featured: document.getElementById('pf-feat') ? document.getElementById('pf-feat').checked : false,
    stock: stockEl && stockEl.value!=='' ? parseInt(stockEl.value) : null,
    stockAlert: stockAlertEl && stockAlertEl.value!=='' ? parseInt(stockAlertEl.value) : 3,
    allergens: Array.from(document.querySelectorAll('input[name="pf-allergen"]:checked')).map(function(el){return el.value;})
  };
  var noConfigEl = document.getElementById('pf-noconfig');
  if (noConfigEl) data.noConfig = noConfigEl.checked;

  // Viandes autorisées
  var meatChecks = document.querySelectorAll('input[name="pf-meat"]');
  if (meatChecks.length > 0) {
    var allChecked = Array.from(meatChecks).every(function(el){return el.checked;});
    if (allChecked) {
      data.allowedMeats = null; // toutes autorisées = null (pas de restriction)
    } else {
      data.allowedMeats = Array.from(meatChecks).filter(function(el){return el.checked;}).map(function(el){return el.value;});
    }
  }

  // Boisson incluse
  var drinkToggle = document.getElementById('pf-drink-toggle');
  if (drinkToggle) {
    if (drinkToggle.checked) {
      var drinkSel = document.getElementById('pf-drink-id');
      data.includedDrink = drinkSel ? (drinkSel.value || null) : null;
    } else {
      data.includedDrink = null;
    }
  }

  // Note client autorisée
  var allowNoteEl = document.getElementById('pf-allownote');
  data.allowNote = allowNoteEl ? allowNoteEl.checked : true;

  // Supprimer toutes les valeurs undefined ou null inutiles
  Object.keys(data).forEach(function(k){ if (data[k] === undefined) delete data[k]; });
  return data;
}

function adminStats(period, dateFrom, dateTo){
  period = period||'all';
  var allOrders = getOrders();
  var now = new Date();

  // Filtrer par période
  var filtered = allOrders.filter(function(o){
    if(o.status==='cancelled') return false;
    var d = new Date(o.createdAt);
    if(period==='week')  return (now-d)<7*86400000;
    if(period==='month') return (now-d)<30*86400000;
    if(period==='custom' && dateFrom && dateTo){
      var from = new Date(dateFrom+'T00:00:00');
      var to   = new Date(dateTo+'T23:59:59');
      return d>=from && d<=to;
    }
    return true;
  });

  var done    = filtered.filter(function(o){return o.status==='picked_up';});
  var revenue = done.reduce(function(s,o){return s+(o.total||0);},0);
  var avg     = done.length ? revenue/done.length : 0;
  var clients = getUsers().filter(function(u){var r=u.role||'client';return r==='client'||r==='';});

  // CA par jour de semaine
  var byDay=[0,0,0,0,0,0,0], byDayCount=[0,0,0,0,0,0,0];
  done.forEach(function(o){
    var d=new Date(o.createdAt).getDay();
    byDay[d]+=(o.total||0); byDayCount[d]++;
  });
  var dayNames=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  var maxDay=Math.max.apply(null,byDay)||1;

  // Affluence par heure
  var byHour={};
  filtered.forEach(function(o){
    var h=o.pickupTime?o.pickupTime.split(':')[0]:null;
    if(h) byHour[h]=(byHour[h]||0)+1;
  });
  var maxHour=Math.max.apply(null,Object.values(byHour).concat([1]));

  // Top produits
  var freq={};
  done.forEach(function(o){(o.items||[]).forEach(function(i){if(i.cat!=='reward') freq[i.name]=(freq[i.name]||0)+1;});});
  var top=Object.entries(freq).sort(function(a,b){return b[1]-a[1];}).slice(0,8);

  var html='<div style="padding:0 .9rem 5rem">';

  // ── Sélecteur de période ──
  var customStyle = 'display:'+(period==='custom'?'flex':'none')+';gap:.4rem;margin-top:.4rem;align-items:center;flex-wrap:wrap';
  html+='<div style="margin:.75rem 0">'
    +'<div style="display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.3rem">'
    +'<button class="btn btn-sm '+(period==='all'?'btn-primary':'btn-secondary')+'" onclick="document.getElementById(&apos;admin-content&apos;).innerHTML=adminStats(&apos;all&apos;)">Tout</button>'
    +'<button class="btn btn-sm '+(period==='month'?'btn-primary':'btn-secondary')+'" onclick="document.getElementById(&apos;admin-content&apos;).innerHTML=adminStats(&apos;month&apos;)">30 jours</button>'
    +'<button class="btn btn-sm '+(period==='week'?'btn-primary':'btn-secondary')+'" onclick="document.getElementById(&apos;admin-content&apos;).innerHTML=adminStats(&apos;week&apos;)">7 jours</button>'
    +'<button class="btn btn-sm '+(period==='custom'?'btn-primary':'btn-secondary')+'" onclick="toggleStatsCustom()">📅 Période</button>'
    +'</div>'
    +'<div id="stats-custom-range" style="'+customStyle+'">'
    +'<input type="date" id="stats-from" class="form-input" style="flex:1;padding:.3rem .5rem;font-size:.8rem" value="'+(dateFrom||'')+'">'
    +'<span class="text-sm text-muted">→</span>'
    +'<input type="date" id="stats-to" class="form-input" style="flex:1;padding:.3rem .5rem;font-size:.8rem" value="'+(dateTo||'')+'">'
    +'<button class="btn btn-primary btn-sm" onclick="applyStatsCustom()">OK</button>'
    +'</div>'
    +'</div>';

  // ── KPIs ──
  html+='<div class="stat-grid">'
    +'<div class="stat-card"><div class="stat-val">'+fmt(revenue)+'</div><div class="stat-lbl">CA</div></div>'
    +'<div class="stat-card"><div class="stat-val">'+done.length+'</div><div class="stat-lbl">Commandes</div></div>'
    +'<div class="stat-card"><div class="stat-val">'+fmt(avg)+'</div><div class="stat-lbl">Panier moy.</div></div>'
    +'<div class="stat-card"><div class="stat-val">'+clients.length+'</div><div class="stat-lbl">Clients</div></div>'
    +'</div>';

  // ── Bouton export CSV ──
  html+='<button class="btn btn-secondary btn-full" style="margin:.5rem 0" onclick="exportStatsCSV(\''+period+'\',\''+(dateFrom||'')+'\',\''+(dateTo||'')+'\')">'
    +'📊 Exporter en CSV (Excel / Google Sheets)</button>';

  // ── CA par jour ──
  html+='<div class="sec-title mt-2">📅 CA par jour</div><div class="card mb-2">';
  dayNames.forEach(function(d,i){
    var pct=Math.round((byDay[i]/maxDay)*100);
    var col=byDay[i]>0?'var(--red)':'var(--dark4)';
    html+='<div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.45rem">'
      +'<div style="width:28px;font-size:.75rem;font-weight:700;color:var(--muted)">'+d+'</div>'
      +'<div style="flex:1;background:var(--dark4);border-radius:100px;height:8px">'
      +'<div style="background:'+col+';width:'+pct+'%;height:100%;border-radius:100px"></div></div>'
      +'<div style="min-width:60px;text-align:right;font-size:.75rem;font-weight:700;color:var(--gold)">'+fmt(byDay[i])+'</div>'
      +'<div style="min-width:30px;text-align:right;font-size:.7rem;color:var(--muted)">'+byDayCount[i]+'x</div>'
      +'</div>';
  });
  html+='</div>';

  // ── Affluence par créneau ──
  html+='<div class="sec-title">\u{1F550} Affluence par créneau</div><div class="card mb-2">';
  Object.keys(byHour).sort().forEach(function(h){
    var pct=Math.round((byHour[h]/maxHour)*100);
    var col=pct>=80?'#ef4444':pct>=50?'#f59e0b':'#10b981';

  // ── Avis clients ──
  var ratings=load('ba_ratings',[]);

function exportStatsCSV(period, dateFrom, dateTo){
  var allOrders = getOrders();
  var now = new Date();
  var filtered = allOrders.filter(function(o){
    if(o.status==='cancelled') return false;
    var d=new Date(o.createdAt);
    if(period==='week')  return (now-d)<7*86400000;
    if(period==='month') return (now-d)<30*86400000;
    if(period==='custom'&&dateFrom&&dateTo){
      var from=new Date(dateFrom+'T00:00:00');
      var to=new Date(dateTo+'T23:59:59');
      return d>=from&&d<=to;
    }
    return true;
  });

  var BOM = '\uFEFF'; // BOM UTF-8 pour Excel
  var rows = ['N°;Date;Heure retrait;Client;Téléphone;Articles;Total (€);Paiement;Statut'];
  filtered.forEach(function(o){
    var items=(o.items||[]).map(function(i){return i.name+(i.details?' ('+i.details+')':'');}).join(' | ');
    var statuts={pending:'En attente',confirmed:'Confirmée',preparing:'En préparation',ready:'Prête',picked_up:'Récupérée',cancelled:'Annulée'};
    rows.push([
      o.orderNumber||'',
      new Date(o.createdAt).toLocaleDateString('fr-FR'),
      o.pickupTime||'',
      o.userPrenom||'',
      o.userPhone||'',
      '"'+items.replace(/"/g,"'")+'"',
      (o.total||0).toFixed(2).replace('.',','),
      o.payment||'',
      statuts[o.status]||o.status
    ].join(';'));
  });

  // Ajouter totaux en bas
  var done=filtered.filter(function(o){return o.status==='picked_up';});
  var revenue=done.reduce(function(s,o){return s+(o.total||0);},0);
  rows.push('');
  rows.push(';;;;;;TOTAL (CA);'+revenue.toFixed(2).replace('.',',')+';;');
  rows.push(';;;;;;NB COMMANDES;'+done.length+';;');

  var csv = BOM + rows.join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var label = period==='custom'?(dateFrom+'_au_'+dateTo):period;
  a.href=url; a.download='break_antillais_stats_'+label+'.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('Export CSV téléchargé !','success');
}


function generateMarketCode(userId, amount) {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var rand = function(n){ var s=''; for(var i=0;i<n;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; };
  var code = 'BA-' + rand(4) + '-' + rand(4);
  var cfg = getCfg();
  var pts = Math.floor(amount) * (cfg.ptsPerEuro || 5);
  var obj = {code:code, userId:userId, amount:amount, pts:pts, createdAt:new Date().toISOString(), used:false};
  db.ref('data/market_codes/' + code).set(obj);
  return obj;
}

function mcSearchPhone(val) {
  var res = document.getElementById('mc-phone-results');
  if (!res) return;
  var q = (val||'').trim().toLowerCase();
  var clean = q.replace(/[^0-9]/g,'');
  if (q.length < 2) { res.innerHTML = ''; return; }
  var users = getUsers().filter(function(u){ return !u.role || u.role==='client'; });
  var found = users.filter(function(u){
    var nameMatch = (u.prenom||'').toLowerCase().indexOf(q) >= 0;
    var phoneMatch = clean.length >= 3 && (u.phone||'').replace(/[^0-9]/g,'').indexOf(clean) >= 0;
    return nameMatch || phoneMatch;
  });
  if (!found.length) {
    res.innerHTML = '<div class="text-sm" style="color:#f59e0b;padding:.3rem 0">⚠️ Client non enregistré — un code SMS sera généré</div>';

    var btn = document.getElementById('mc-action-btn');
    if (btn) btn.textContent = 'Générer code + envoyer SMS';
    return;
  }
  var btn2 = document.getElementById('mc-action-btn');
  if (btn2) btn2.textContent = 'Créditer les points directement';
  var h = '';
  found.slice(0,6).forEach(function(u) {
    var pts = u.points || 0;
    h += '<div data-uid="'+u.id+'" onclick="mcSelectClient(this.dataset.uid)"'
      + ' style="display:flex;justify-content:space-between;align-items:center;padding:.45rem .65rem;'

      + '<span style="color:var(--gold);font-size:.8rem;font-weight:700">'+pts+' pts</span>'

  });

}

function redeemMarketCode(code) {
  if (!code || !code.trim()) { toast('Entrez un code','error'); return; }
  var codeUpper = code.trim().toUpperCase();
  db.ref('data/market_codes/' + codeUpper).once('value').then(function(snap){
    var c = snap.val();
    if (!c) { toast('Code invalide','error'); return; }
    if (c.used) { toast('Ce code a deja ete utilise','error'); return; }
    var user = getCurrentUser();
    if (!user) { toast('Connectez-vous','error'); return; }
    // Vérifier que le code appartient à ce compte OU au numéro de téléphone
  var phoneMatch = c.phone && c.phone.replace(/[^0-9]/g,'') === (user.phone||'').replace(/[^0-9]/g,'');
  if (c.userId && c.userId !== user.id) { toast('Ce code n\'est pas pour votre compte','error'); return; }
  if (!c.userId && !phoneMatch) { toast('Ce code est lie a un autre numero de telephone','error'); return; }
  // Si c'était un client inconnu, lier maintenant au compte
  if (c.unknownClient && !c.userId) {
    db.ref('data/market_codes/' + codeUpper + '/userId').set(user.id);
  }
    var created = new Date(c.createdAt);
    if ((new Date() - created) > 7*24*60*60*1000) { toast('Code expire','error'); return; }
    db.ref('data/market_codes/' + codeUpper + '/used').set(true);
    user.points = (user.points || 0) + c.pts;
    db.ref('data/users/' + user.id + '/points').set(user.points);
    var hist = load('ba_pts_history_' + user.id, []);
    hist.unshift({pts: c.pts, label: 'Achat marche (' + c.amount.toFixed(2) + 'EUR)', at: new Date().toISOString()});
    save('ba_pts_history_' + user.id, hist);
    saveUser(user);
    setCurrentUser(user);
    toast('+' + c.pts + ' points ajoutes !', 'success', 4000);
    renderProfile();
  }).catch(function(){ toast('Erreur verification','error'); });
}

function createPromoCode() {
  var code = (document.getElementById('pc-code').value||'').trim().toUpperCase();
  var pts = parseInt(document.getElementById('pc-pts').value)||0;
  var limit = parseInt(document.getElementById('pc-limit').value)||0;
  var expiry = document.getElementById('pc-expiry').value||null;
  if (!pts) { toast('Points requis','error'); return; }
  if (!code) {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    code = 'BA'; for(var i=0;i<6;i++) code+=chars[Math.floor(Math.random()*chars.length)];
  }
  var obj = {code:code, pts:pts, limit:limit, used:0, expiry:expiry, createdAt:new Date().toISOString(), active:true};
  db.ref('data/promo_codes/'+code).set(obj).then(function(){
    toast('Code '+code+' cree !','success');
    document.getElementById('pc-code').value = '';
    document.getElementById('pc-pts').value = '';
    document.getElementById('pc-limit').value = '1';
    loadPromoCodes();
  });
}

function loadPromoCodes() {
  var list = document.getElementById('pc-list');
  if (!list) return;
  db.ref('data/promo_codes').once('value').then(function(snap){
    var codes = [];
    snap.forEach(function(s){ if(s.val()) codes.push(s.val()); });
    if (!codes.length) {
      list.innerHTML = '<div class="text-sm text-muted" style="padding:.5rem 0">Aucun code créé.</div>';
      return;
    }
    codes.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    var h = '';
    codes.forEach(function(p){
      var expired = p.expiry && new Date(p.expiry) < new Date();
      var full = p.limit > 0 && p.used >= p.limit;
      var inactive = !p.active || expired || full;
      var statusLabel = expired ? 'Expiré' : full ? 'Épuisé' : !p.active ? 'Désactivé' : 'Actif';
      var statusCol = inactive ? '#ef4444' : '#10b981';
      var expiryStr = p.expiry ? new Date(p.expiry).toLocaleDateString('fr-FR') : 'Jamais';
      h += '<div style="background:var(--dark3);border-radius:10px;padding:.7rem .9rem;margin-bottom:.5rem;border:1px solid var(--border)">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem">';
      h += '<div style="font-family:monospace;font-weight:800;font-size:1rem;letter-spacing:.08em">'+p.code+'</div>';
      h += '<span style="font-size:.72rem;font-weight:700;background:'+(inactive?'rgba(239,68,68,.12)':'rgba(16,185,129,.12)')+';color:'+statusCol+';border-radius:100px;padding:.15rem .55rem">'+statusLabel+'</span>';
      h += '</div>';
      h += '<div style="font-size:.78rem;color:var(--muted);margin-bottom:.5rem">';
      h += '<span style="color:var(--gold);font-weight:700">+'+p.pts+' pts</span>';
      h += ' &bull; Utilisé: <strong>'+p.used+'</strong>/'+(p.limit > 0 ? p.limit : '∞');
      h += ' &bull; Expire: '+expiryStr;
      h += '</div>';
      h += '<div style="display:flex;gap:.4rem">';
      h += '<button class="btn btn-sm" style="flex:1;font-size:.75rem;background:rgba(212,175,55,.1);border-color:rgba(212,175,55,.3);color:#D4AF37" data-code="'+p.code+'" onclick="editPromoCode(this.dataset.code)">✏️ Modifier</button>';
      h += '<button class="btn btn-sm" style="flex:1;font-size:.75rem;background:rgba(255,255,255,.05);border-color:var(--border);color:var(--muted)" data-code="'+p.code+'" data-active="'+(p.active?'1':'0')+'" onclick="togglePromoCode(this.dataset.code,this.dataset.active)">'+(!p.active?'✅ Activer':'⏸ Désactiver')+'</button>';
      h += '<button class="btn btn-sm btn-danger" style="font-size:.75rem;padding:.3rem .6rem" data-code="'+p.code+'" onclick="deletePromoCode(this.dataset.code)">🗑</button>';
      h += '</div></div>';
    });
    list.innerHTML = h;
  }).catch(function(e){ list.innerHTML = '<div class="text-sm text-muted">Erreur: '+e.message+'</div>'; });
}

function redeemPromoCode(code) {
  if (!code || !code.trim()) { showPromoError('Entrez un code valide.'); return; }
  var user = getCurrentUser();
  if (!user) { toast('Connectez-vous pour utiliser un code','warning'); return; }
  var codeUp = code.trim().toUpperCase();
  var btn = document.getElementById('promo-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  db.ref('data/promo_codes/'+codeUp).once('value').then(function(snap){
    var p = snap.val();
    // Validations
    if (!p || !p.active) {
      showPromoError('Ce code est invalide ou inexistant.');
      if (btn) { btn.disabled = false; btn.textContent = 'Valider'; }
      return;
    }
    if (p.expiry && new Date(p.expiry) < new Date()) {
      showPromoError('Ce code a expiré le '+new Date(p.expiry).toLocaleDateString('fr-FR')+'.');
      if (btn) { btn.disabled = false; btn.textContent = 'Valider'; }
      return;
    }
    if (p.limit > 0 && p.used >= p.limit) {
      showPromoError('Ce code a atteint sa limite d\'utilisation.');
      if (btn) { btn.disabled = false; btn.textContent = 'Valider'; }
      return;
    }
    // Vérifier si ce client a déjà utilisé ce code
    db.ref('data/promo_uses/'+codeUp+'/'+user.id).once('value').then(function(usnap){
      if (usnap.exists()) {
        showPromoError('Vous avez déjà utilisé ce code sur votre compte.');
        if (btn) { btn.disabled = false; btn.textContent = 'Valider'; }
        return;
      }
      // ── Tout est valide — Appliquer de façon atomique ──
      var updates = {};
      updates['data/promo_codes/'+codeUp+'/used'] = (p.used||0) + 1;
      updates['data/promo_uses/'+codeUp+'/'+user.id] = new Date().toISOString();
      updates['data/users/'+user.id+'/points'] = (user.points||0) + p.pts;
      db.ref().update(updates).then(function(){
        // Mettre à jour le cache local
        user.points = (user.points||0) + p.pts;
        var hist = load('ba_pts_history_'+user.id, []);
        hist.unshift({pts: p.pts, label: 'Code promo: '+codeUp, at: new Date().toISOString()});
        save('ba_pts_history_'+user.id, hist);
        saveUser(user);
        setCurrentUser(user);
        // Modale de succès
        showPromoSuccess(p.pts, codeUp, user.points);
        if (btn) { btn.disabled = false; btn.textContent = 'Valider'; }
      }).catch(function(e){
        showPromoError('Erreur lors de l\'application du code. Réessayez.');
        if (btn) { btn.disabled = false; btn.textContent = 'Valider'; }
      });
    }).catch(function(){
      showPromoError('Erreur de vérification. Réessayez.');
      if (btn) { btn.disabled = false; btn.textContent = 'Valider'; }
    });
  }).catch(function(){
    showPromoError('Erreur de connexion. Vérifiez votre réseau.');
    if (btn) { btn.disabled = false; btn.textContent = 'Valider'; }
  });
}

function getFilteredClients(target) {
  var allUsers = getUsers();
  // If no users in cache, try to get from Firebase sync
  if (!allUsers.length) {
    toast('Chargement des clients...', 'info', 2000);
  }
  var allClients = allUsers.filter(function(u){ return !u.role || u.role==='client'; });
  var now = new Date();
  if (target === 'all') return allClients;
  if (target === 'inactive' || target === 'inactive30') {
    var days = target === 'inactive' ? 14 : 30;
    var orders = getOrders();
    return allClients.filter(function(u){
      var lastOrder = orders.filter(function(o){ return o.userId===u.id && o.status!=='cancelled'; })
        .sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); })[0];
      if (!lastOrder) {
        // No orders - check signup date
        var signupDays = (now - new Date(u.createdAt)) / (1000*60*60*24);
        return signupDays >= days;
      }
      var daysSince = (now - new Date(lastOrder.createdAt)) / (1000*60*60*24);
      return daysSince >= days;
    });
  }
  if (target.startsWith('palier-')) {
    var palierName = target.replace('palier-','');
    return allClients.filter(function(u){
      var p = getPalier(u.points||0);
      return p.name === palierName;
    });
  }
  return allClients;
}

function sendAdminMessage() {
  var target = document.getElementById('msg-target').value;
  var type = document.getElementById('msg-type').value;
  var title = (document.getElementById('msg-title').value||'').trim();
  var body = (document.getElementById('msg-body').value||'').trim();
  if (!title || !body) { toast('Titre et message requis','error'); return; }
  toast('Envoi en cours...','info', 2000);
  // Reload fresh users from Firebase
  db.ref('data/users').once('value').then(function(snap) {
    var usersObj = snap.val() || {};
    var usersArr = Object.values(usersObj).filter(function(u){ return u && (!u.role || u.role==='client'); });
    if (!usersArr.length) { toast('Aucun client inscrit','warning'); return; }
    // Filter by target
    var now = new Date();
    var orders = getOrders();
    var clients = usersArr;
    if (target === 'inactive' || target === 'inactive30') {
      var days = target === 'inactive' ? 14 : 30;
      clients = usersArr.filter(function(u){
        var lastO = orders.filter(function(o){ return o.userId===u.id && o.status!=='cancelled'; })
          .sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); })[0];
        var ref = lastO ? new Date(lastO.createdAt) : new Date(u.createdAt);
        return (now - ref) / (1000*60*60*24) >= days;
      });
    } else if (target.startsWith('palier-')) {
      var palierName = target.replace('palier-','');
      clients = usersArr.filter(function(u){ return getPalier(u.points||0).name===palierName; });
    }
    if (!clients.length) { toast('Aucun client correspond a ce filtre','warning'); return; }
    var expiry = document.getElementById('msg-expiry');
    var expiryVal = expiry ? expiry.value : null;
    clients.forEach(function(u){
      if (type === 'promo') {
        var promos = load('ba_promos', []);
        var exp = expiryVal ? new Date(expiryVal).toISOString() : new Date(Date.now()+7*86400000).toISOString();
        promos.push({id:genId(),userId:u.id,type:'limited',title:title,desc:body,expiresAt:exp,used:false});
        save('ba_promos', promos);
      }
      notify(u.id, title, body);
      osSendPush(u.id, title, body, 0);
    });
    toast('✅ Message envoye a '+clients.length+' client(s) !','success', 5000);
    ['msg-title','msg-body'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  }).catch(function(e){ toast('Erreur envoi: '+e.message,'error'); });
}

function filterClients(query) {

  var q = query.toLowerCase().trim();

    return u.prenom.toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q) || (u.phone||'').includes(q);

  allProds.sort(function(a,b){ return a.name.localeCompare(b.name,'fr'); });

  var wrap = document.getElementById("pal-choices-wrap-"+palierIdx);
  var already = [];
  if(wrap){ wrap.querySelectorAll('input[type=checkbox]').forEach(function(inp){ already.push(inp.dataset.prod); }); }
  // Produits pas encore présents
  var toShow = allProds.filter(function(p){ return already.indexOf(p.name)<0; });

  // Créer la modale de sélection
  var existing = document.getElementById('modal-add-choice');
  if(existing) existing.remove();

  var m = document.createElement('div');
  m.id = 'modal-add-choice';
  m.style.cssText = 'position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center';
  
  var cats = {};
  toShow.forEach(function(p){
    var cat = p.cat || 'autre';
    if(!cats[cat]) cats[cat] = [];
    cats[cat].push(p);
  });
  
  var catLabels = {bokit:'🫓 Bokits', agoulou:'🌯 Agoulou', crepe_salee:'🥞 Crêpes salées', crepe_sucree:'🍫 Crêpes sucrées', mini_bokit:'📦 Box Mini', enfant:'🧒 Enfants', boisson:'🥤 Boissons'};
  
  var inner = '<div style="background:var(--dark2);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:75vh;overflow-y:auto;padding:1.25rem">';
  inner += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">';
  inner += '<div style="font-weight:800;font-size:1.05rem">Ajouter un produit au palier</div>';
    inner += '<button onclick="closeAddChoiceModal()" style="background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer">×</button></div>';
  
  if(!toShow.length){
    inner += '<p style="color:var(--muted);font-size:.85rem;text-align:center;padding:1rem 0">Tous les produits sont déjà ajoutés</p>';
  } else {
    Object.keys(cats).forEach(function(cat){
      inner += '<div style="font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:.75rem 0 .35rem">'+(catLabels[cat]||cat)+'</div>';
      inner += '<div style="display:flex;flex-direction:column;gap:.3rem">';
      cats[cat].forEach(function(p){
        inner += '<button data-prodname="'+p.name.replace(/"/g,"&quot;")+'" data-pi="'+palierIdx+'" onclick="confirmAddChoiceToPalier(this)" style="background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:.55rem .85rem;text-align:left;color:var(--text);font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:.5rem">'+p.name+(p.price?'<span style=\"color:var(--muted);font-size:.75rem;margin-left:auto\">'+p.price+'€</span>':'')+'</button>';
      });
      inner += '</div>';
    });
  }
  inner += '</div>';
  m.innerHTML = inner;
  m.addEventListener('click', function(e){ if(e.target===m) m.remove(); });
  document.body.appendChild(m);
}

function saveMeats() {
  var updated = [];
  var i = 0;
  while(true) {
    var n = document.getElementById('meat-name-'+i);
    if (!n) break;
    var p = document.getElementById('meat-price-'+i);
    var o = document.getElementById('meat-ok-'+i);
    updated.push({
      name: n.value.trim() || ('Viande '+i),
      price: p ? (parseFloat(p.value)||6.50) : 6.50,
      ok: o ? o.checked : true,
      halal: document.getElementById('meat-halal-'+i) ? document.getElementById('meat-halal-'+i).checked : false,
      supplementPrice: document.getElementById('meat-suprice-'+i) ? (parseFloat(document.getElementById('meat-suprice-'+i).value)||0.50) : 0.50
    });
    i++;
  }
  if (updated.length === 0) { toast('Aucune viande trouvee','error'); return; }
  updated.sort(function(a,b){return a.name.localeCompare(b.name,'fr');});
  save('ba_meats', updated);
  MEATS = updated.map(function(m){return m.name;});
  MEAT_PRICES = {};
  updated.forEach(function(m){MEAT_PRICES[m.name]=m.price;});
  toast('Viandes enregistrees !','success');
  var ml = document.getElementById('meats-list') || document.getElementById('pf-meats-list');
  if(ml) ml.innerHTML = buildMeatsList();
}
function saveMeatsInline() {
  saveMeats();
  var ml = document.getElementById('pf-meats-list');
  if(ml) ml.innerHTML = buildMeatsList();
}
function addMeat() {
  var meats = getMeats();
  meats.push({name:'Nouvelle viande', price:6.50, ok:true});
  save('ba_meats', meats);
  var ml = document.getElementById('meats-list') || document.getElementById('pf-meats-list');

}
function deleteMeat(i) {
  var meats = getMeats();
  if(meats.length<=1){toast('Gardez au moins 1 viande','warning');return;}
  meats.splice(parseInt(i),1);
  save('ba_meats', meats);
  var ml = document.getElementById('meats-list') || document.getElementById('pf-meats-list');
  if(ml) ml.innerHTML = buildMeatsList();
  toast('Viande supprimee','info');
}

function buildSlotToggles() {
  try {
  var cfg = getCfg();
  var today = new Date().toISOString().split('T')[0];
  var slots = getSlots(today, cfg);
  if (!slots.length) return '<span class="text-muted text-sm">Aucun creneau configure</span>';
  var disabled = cfg.disabledSlots || [];
  var h = '';
  slots.forEach(function(s) {
    var isOff = disabled.indexOf(s.time) >= 0;
    var col = isOff ? '#ef4444' : '#10b981';
    var bg  = isOff ? 'rgba(200,35,43,.2)' : 'rgba(16,185,129,.1)';
    var lbl = (isOff ? '🔴 ' : '🟢 ') + s.time;
    h += '<button data-slot="' + s.time + '" onclick="toggleSlot(this.dataset.slot,this)"'
      + ' style="padding:.35rem .7rem;border-radius:6px;font-size:.82rem;font-weight:700;cursor:pointer;'
      + 'border:1px solid ' + col + ';background:' + bg + ';color:' + col + '">'
      + lbl + '</button>';
  });
  return h;
  } catch(e) { return '<span class="text-muted text-sm">Creneaux non disponibles</span>'; }
}
function toggleSlot(time, btn) {
  var cfg = getCfg();
  var disabled = (cfg.disabledSlots || []).slice();
  var idx = disabled.indexOf(time);
  if (idx >= 0) {
    disabled.splice(idx, 1);
  } else {
    disabled.push(time);
  }
  cfg.disabledSlots = disabled;
  save('ba_cfg', cfg);
  // Mettre à jour le bouton visuellement
  var isOff = disabled.indexOf(time) >= 0;
  btn.style.borderColor = isOff ? '#ef4444' : '#10b981';
  btn.style.background = isOff ? 'rgba(200,35,43,.2)' : 'rgba(16,185,129,.1)';
  btn.style.color = isOff ? '#ef4444' : '#10b981';
  btn.textContent = (isOff ? '🔴 ' : '🟢 ') + time;
  toast(time + (isOff ? ' bloqué' : ' réouvert'), isOff ? 'warning' : 'success', 2000);
}

function importAllData(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.version || !data.ba_users) { toast('Fichier invalide','error'); return; }
      // Restore all keys
      Object.keys(data).forEach(function(k){
        if (k === 'version' || k === 'exportedAt') return;
        if (data[k] !== null && data[k] !== undefined) {
          save(k, data[k]);
        }
      });
      save('ba_last_save', new Date().toISOString());
      toast('Donnees importees ! Rechargement...','success', 3000);
      setTimeout(function(){ location.reload(); }, 2000);
    } catch(err) {
      toast('Erreur lors de l\'import : '+err.message,'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function togglePtsReduction(id) {
  var user = getCurrentUser();
  if (!user) return;
  var total = cart.reduce(function(s,i){return s+i.price*i.qty;},0);

  // Build full list of available options
  var palierList = load('ba_paliers', PALIERS);

  var curPalierFull = palierList.find(function(p){ return p.name===curPalier.name; });
  var allOptions = [];

  if (curPalierFull && curPalierFull.reward && curPalier.name !== 'Bronze') {
    allOptions.push({id:'palier', label:curPalierFull.reward, pts:0, discount:0, type:'palier', reward:curPalierFull.reward});
  }

  var promos = load('ba_promos',[]).filter(function(p){
    return p.userId===user.id && !p.used && new Date(p.expiresAt)>new Date();
  });
  promos.forEach(function(p){
    allOptions.push({id:'promo-'+p.id, label:p.title, pts:0, discount:0, type:'promo', promoId:p.id});
  });
  // Points reduction
  getPointsReductions(user.points||0, curPalier, total).forEach(function(r){ allOptions.push(r); });

  var opt = allOptions.find(function(x){return x.id===id;});
  if (!opt) return;

  // Deselect previous
  if (_selectedReduction) {
    var prevEl = document.getElementById('pts-opt-'+_selectedReduction.id);

    if (prevEl) { prevEl.style.borderColor='var(--border)'; prevEl.style.background=''; }
    if (prevCk) { prevCk.style.background='transparent'; }
  }

  if (_selectedReduction && _selectedReduction.id === id) {
    _selectedReduction = null;
  } else {
    _selectedReduction = opt;
    var el = document.getElementById('pts-opt-'+id);
    var ck = document.getElementById('pts-check-'+id);

function playPresenceAlert() {
  // Son "ding" doux pour signaler la présence client
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[1046,0,.08],[1318,.1,.08],[1568,.2,.15],[1318,.38,.08],[1568,.5,.25]].forEach(function(b){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = b[0];
      gain.gain.setValueAtTime(0.0001, ctx.currentTime+b[1]);
      gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+b[1]+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+b[1]+b[2]);
      osc.start(ctx.currentTime+b[1]);
      osc.stop(ctx.currentTime+b[1]+b[2]+0.05);
    });
  } catch(e) { console.warn('Son présence:', e); }
  if (navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
}

// ── Audio mobile ──
// Les navigateurs mobiles creent tout AudioContext en etat "suspended" tant que
// l'utilisateur n'a pas interagi avec la page. L'ancien code creait un nouveau
// contexte a chaque alerte : sur telephone il restait suspendu = aucun son.
// On garde donc UN seul contexte, debloque au premier appui sur l'ecran.
var _baAudioCtx = null;
function _baGetAudioCtx() {
  try {
    if (!_baAudioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      _baAudioCtx = new AC();
    }
    if (_baAudioCtx.state === 'suspended' && _baAudioCtx.resume) _baAudioCtx.resume();
    return _baAudioCtx;
  } catch(e) { return null; }
}
function _baUnlockAudio() {
  var ctx = _baGetAudioCtx();
  if (ctx && ctx.state === 'running') {
    document.removeEventListener('touchstart', _baUnlockAudio);
    document.removeEventListener('click', _baUnlockAudio);
    console.log('[BA] Audio debloque');
  }
}
try {
  document.addEventListener('touchstart', _baUnlockAudio, {passive:true});
  document.addEventListener('click', _baUnlockAudio);
} catch(e) {}

function playAdminAlert() {
  try {
    var ctx = _baGetAudioCtx();
    if (!ctx) throw new Error('no audio ctx');
    // Triple beep - urgent
    [[880,0,.15],[660,.2,.15],[880,.4,.15],[660,.6,.3]].forEach(function(b){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = b[0]; osc.type = 'square';
      gain.gain.setValueAtTime(0.15, ctx.currentTime+b[1]);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+b[1]+b[2]);
      osc.start(ctx.currentTime+b[1]);
      osc.stop(ctx.currentTime+b[1]+b[2]+0.05);
    });
  } catch(e) { console.warn('[BA] son indisponible:', e); }
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
}

function startOrderPolling() {
  setInterval(function(){
    var user = getCurrentUser();
    if (!user) return;
    var isAdmin = user.role==='superadmin'||user.role==='admin'||user.role==='entreprise';

    if (isAdmin) {
      // Admin: check for new orders
      var allOrders = getOrders();
      var pendingOrders = allOrders.filter(function(o){ return o.status==='pending'; });
      if (_lastOrderCount >= 0 && pendingOrders.length > _lastOrderCount && _adminAlertEnabled) {
        // New order(s) arrived!
        var newOrders = pendingOrders.slice(0, pendingOrders.length - _lastOrderCount);
        newOrders.forEach(function(o){
          playAdminAlert();
          showNewOrderBanner(o);
          sendPushNotif('🆕 Nouvelle commande !', 'N°'+o.orderNumber+' — '+o.userPrenom+' — '+fmt(o.total||0));
        });
      }
      _lastOrderCount = pendingOrders.length;
      // Refresh admin orders tab if open (ecran Commandes ou panneau Profil)
      if (currentScreen === 'profile' || currentScreen === 'orders') {
        if (!refreshAdminOrdersView()) {
          var ac = adminContentEl();
          var activeTab = document.querySelector('.admin-tab.active');
          if (ac && activeTab && activeTab.textContent.indexOf('Dashboard') >= 0) {
            ac.innerHTML = adminDashboard();
          }
        }
      }
      return;
    }

    // Auto relance check (once per session via flag)
    if (!window._relanceChecked) {
      window._relanceChecked = true;
      checkAutoRelance();
    }
    // Client: check order status changes
    var orders = getOrders().filter(function(o){ return o.userId === user.id; });
    orders.forEach(function(o){
      var prev = _lastOrderStatuses[o.id];
      if (prev && prev !== o.status) {
        if (o.status === 'ready') {
          showOrderReadyAlert(o);
        }
      }
      _lastOrderStatuses[o.id] = o.status;
    });
    if (Object.keys(_lastOrderStatuses).length === 0) {
      orders.forEach(function(o){ _lastOrderStatuses[o.id] = o.status; });
    }
    if (currentScreen === 'orders') renderOrders();
    var freshUser = getUsers().find(function(u){ return u.id === user.id; });
    if (freshUser) { window._currentUserCached = freshUser; updateBadges(); }
  }, 5000);
}

// Commandes deja signalees comme pretes (evite les pop-ups en double)
var _readyAlerted = {};
function showOrderReadyAlert(order) {
  // ── Anti-doublon ──
  // Trois sources signalent la meme commande prete : le listener temps reel
  // ba_orders, la notification status_updates envoyee par l'admin, et le
  // polling 5s. Sans ce garde-fou, plusieurs calques se superposaient et il
  // fallait appuyer sur "OK j'arrive" autant de fois qu'il y avait de couches.
  var _key = String((order && (order.id || order.orderNumber)) || 'x');
  if (_readyAlerted[_key]) return;
  if (document.getElementById('order-ready-overlay')) return;
  _readyAlerted[_key] = true;
  // Sound alert (contexte audio partage : indispensable pour que le son sorte sur mobile)
  try {
    var ctx = _baGetAudioCtx();
    if (!ctx) throw new Error('no audio ctx');
    var playBeep = function(freq, start, dur) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.1);
    };
    playBeep(523, 0, 0.15);
    playBeep(659, 0.2, 0.15);
    playBeep(784, 0.4, 0.3);
  } catch(e) {}
  // Browser notification if permitted
  if (window.Notification && Notification.permission === 'granted') {
    new Notification('🎉 Votre commande est prête !', {
      body: 'Venez recuperer votre commande !',
      icon: ''
    });
  }
  // Full screen overlay
  var overlay = document.createElement('div');
  overlay.id = 'order-ready-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9998;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease';
  overlay.innerHTML = '<div style="text-align:center;padding:2rem;max-width:360px">'
    +'<div style="font-size:5rem;margin-bottom:1rem;animation:pulse 1s ease-in-out infinite">🎉</div>'
    +'<div style="font-family:var(--head);font-size:2rem;font-weight:800;color:#fff;margin-bottom:.5rem">Votre commande</div>'
    +'<div style="font-family:var(--head);font-size:2rem;font-weight:800;color:var(--red);margin-bottom:.5rem">est prête !</div>'
    +'<div style="font-size:1rem;color:rgba(255,255,255,.7);margin-bottom:2rem">Votre commande est prête !<br>Venez la récupérer !</div>'
    +'<button class="btn btn-primary" style="font-size:1.1rem;padding:1rem 2.5rem" onclick="closeOrderReadyAlert()">OK, j&apos;arrive ! 🏃</button>'
    +'</div>';
  document.body.appendChild(overlay);
  // Request notification permission for future
  if (window.Notification && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  // Also try vibration on mobile
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
}

// ══ EXPIRATION DES POINTS ══
// Trimestres : T1=Jan-Mar, T2=Avr-Jun, T3=Jul-Sep, T4=Oct-Déc
// Les points expirent le dernier jour du trimestre en cours + 1 trimestre

function getPtsExpiryDate() {
  // Calcule la prochaine date d'expiration des points
  // = dernier jour du trimestre actuel
  var now = new Date();
  var m = now.getMonth(); // 0-11
  var y = now.getFullYear();
  var endMonth; // dernier mois du trimestre actuel (0-indexed)
  if (m <= 2)       endMonth = 2;  // T1 : expire 31 mars
  else if (m <= 5)  endMonth = 5;  // T2 : expire 30 juin
  else if (m <= 8)  endMonth = 8;  // T3 : expire 30 sept
  else              endMonth = 11; // T4 : expire 31 déc
  // Dernier jour du mois endMonth
  var expiry = new Date(y, endMonth + 1, 0); // jour 0 du mois suivant = dernier jour du mois
  expiry.setHours(23, 59, 59, 0);
  return expiry;
}

function getPtsExpiryStr(date) {
  // "31 mars 2026"
  return date.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}

function checkPointsExpiry(user) {
  if (!user || !user.id) return;
  if (!user.points || user.points <= 0) return;

  var now = new Date();
  var expiry = getPtsExpiryDate();
  var msLeft = expiry.getTime() - now.getTime();
  var daysLeft = Math.ceil(msLeft / 86400000);

  // ── Expiration effective ──
  // Vérifier si les points ont expiré depuis la dernière connexion
  var lastExpKey = 'ba_pts_exp_done_'+user.id;
  var lastExpDone = load(lastExpKey, null);
  var expiryKey = expiry.toISOString().split('T')[0]; // clé unique par date d'expiration

  if (lastExpDone !== expiryKey) {
    // Vérifier dans Firebase si déjà expiré ce trimestre
    db.ref('data/ba_pts_expired/'+user.id+'/'+expiryKey).once('value').then(function(snap){
      if (snap.val()) {
        save(lastExpKey, expiryKey); // marquer localement aussi
        return;
      }
      // Pas encore expiré — les points actuels sont encore valides
      // (l'expiration se fera le jour J)
    });
  }

  // ── Alerte 10 jours avant ──
  if (daysLeft > 10) return; // pas encore dans la zone d'alerte

  // Vérifier si le client a coché "ne plus afficher" pour cette expiration
  var dismissKey = 'ba_pts_exp_dismiss_'+user.id+'_'+expiryKey;
  var dismissed = load(dismissKey, false);
  if (dismissed) return;

  // Vérifier si l'email d'alerte a déjà été envoyé pour cette expiration
  var emailKey = 'ba_pts_exp_email_'+user.id+'_'+expiryKey;
  db.ref('data/ba_pts_exp_email/'+user.id+'/'+expiryKey).once('value').then(function(snap){
    if (!snap.val() && user.email) {
      // Envoyer l'email d'alerte une seule fois
      sendPointsExpiryEmail(user, user.points, expiry, daysLeft);
      db.ref('data/ba_pts_exp_email/'+user.id+'/'+expiryKey).set(true);
    }
    // Afficher la modale d'alerte dans l'app
    setTimeout(function(){
      showPointsExpiryModal(user, user.points, expiry, daysLeft, dismissKey);
    }, 1500);
  });
}

function sendPointsExpiryEmail(user, pts, expiry, daysLeft) {
  try {
    if (typeof emailjs === 'undefined') return;
    var expiryStr = getPtsExpiryStr(expiry);
    emailjs.send('service_uez8gro', 'template_gs8itxh', {
      email: user.email,
      client_name: user.prenom,
      order_number: 'POINTS-EXP',
      items: '⚠️ Vos '+pts+' points fidélité expirent dans '+daysLeft+' jour'+(daysLeft>1?'s':''),
      total: pts+' points à utiliser avant le '+expiryStr,
      pickup_date: expiryStr,
      pickup_time: '',
      payment: 'Programme fidélité',
      address: 'Commandez avant le '+expiryStr+' pour ne pas perdre vos points !'
    }).catch(function(e){ console.warn('Expiry email:', e); });
  } catch(e) {}
}

function checkBirthdayOffer(user) {
  if (!user || !user.id || !user.bday) return;
  var today = new Date();
  var bday = new Date(user.bday);
  // Vérifier que c'est bien l'anniversaire aujourd'hui
  if (bday.getDate() !== today.getDate() || bday.getMonth() !== today.getMonth()) return;

  var thisYear = today.getFullYear();

  // Vérifier dans Firebase si déjà offert cette année (anti-doublon fiable)
  db.ref('data/ba_bday_'+user.id).once('value').then(function(snap) {
    if (snap.val() === thisYear) return; // déjà attribué cette année

    var cfg = getCfg();
    var bdayPts = cfg.birthdayPts || 50;
    var newTotal = (user.points||0) + bdayPts;
    var histEntry = {pts: bdayPts, label: 'Cadeau anniversaire 🎂', at: new Date().toISOString()};

    // ── Marquer IMMÉDIATEMENT (anti-doublon) ──
    db.ref('data/ba_bday_'+user.id).set(thisYear);
    save('ba_bday_'+user.id, thisYear);

    // ── Écriture atomique des points ──
    var updates = {};
    updates['data/users/'+user.id+'/points'] = newTotal;
    db.ref().update(updates).then(function(){

      // ── Mettre à jour ba_users aussi ──
      db.ref('data/ba_users').once('value').then(function(buSnap){
        var arr = buSnap.val() || [];
        if (!Array.isArray(arr)) arr = Object.values(arr);
        var i = arr.findIndex(function(x){ return x && x.id === user.id; });
        if (i >= 0) {
          arr[i].points = newTotal;
          db.ref('data/ba_users').set(arr);
        }
      });

      // ── Historique points ──
      db.ref('data/ba_pts_history_'+user.id).once('value').then(function(hs){
        var arr2 = hs.val() || [];
        if (!Array.isArray(arr2)) arr2 = Object.values(arr2);
        arr2.unshift(histEntry);
        db.ref('data/ba_pts_history_'+user.id).set(arr2.slice(0, 50));
      });

      // ── Mettre à jour le cache local ──
      user.points = newTotal;
      saveUser(user);
      setCurrentUser(user);

      // ── Notification in-app ──
      notify(user.id, '🎂 Joyeux anniversaire '+user.prenom+' !',
        '+'+bdayPts+' points offerts ! Total : '+newTotal+' pts 🎉');

      // ── Notification status_updates (visible dans l'app) ──
      db.ref('status_updates/'+user.id+'/bday-'+thisYear).set({
        status: 'bday_gift',
        title: '🎂 Joyeux anniversaire '+user.prenom+' !',
        body: 'Break Antillais vous offre +'+bdayPts+' points fidélité aujourd\'hui !',
        pts: bdayPts,
        at: new Date().toISOString()
      });

      // ── Email ──
      try {
        if (user.email && typeof emailjs !== 'undefined') {
          emailjs.send('service_uez8gro', 'template_gs8itxh', {
            email: user.email,
            client_name: user.prenom,
            order_number: 'ANNIV-'+thisYear,
            items: 'Cadeau anniversaire Break Antillais 🎂',
            total: '+'+bdayPts+' points offerts',
            pickup_date: today.toLocaleDateString('fr-FR'),
            pickup_time: '',
            payment: 'Cadeau fidélité',
            address: getCfg().address || ''
          }).catch(function(e){ console.warn('Bday email:', e); });
        }
      } catch(e) {}

      // ── Toast + modale de félicitation ──
      setTimeout(function(){
        updateBadges();
        showBirthdayModal(user.prenom, bdayPts, newTotal);
      }, 800);

    }).catch(function(e){
      console.warn('[Bday] Erreur écriture points:', e);
      // Annuler le marquage si l'écriture a échoué
      db.ref('data/ba_bday_'+user.id).remove();
    });

  }).catch(function(e){ console.warn('[Bday] Erreur vérification:', e); });
}

function confirmRewardChoice(productName, palierName) {
  var products = getProducts();
  var prod = products.find(function(p){ return p.name === productName; });
  // Detect if config needed by category OR by name keywords
  var cat = prod ? prod.cat : '';
  var nameLow = productName.toLowerCase();
  var needsConfig = ['bokit','crepe_salee','agoulou'].indexOf(cat) >= 0
    || nameLow.indexOf('bokit') >= 0
    || nameLow.indexOf('agoulou') >= 0
    || nameLow.indexOf('crepe jambon') >= 0
    || nameLow.indexOf('crepe complete') >= 0;

  // Always use a fake prod object if not found
  if (!prod) {
    prod = {
      id: 'reward-'+palierName,
      name: productName,
      cat: needsConfig ? 'bokit' : 'boisson',
      price: 0,
      ok: true
    };
  }

  if (needsConfig) {
    closeModal('m-product');
    setTimeout(function(){ showRewardConfig(productName, palierName, prod); }, 50);
  } else {

function addRewardConfigToCart(btn) {
  var productName = btn.dataset.pname;

  var cat = btn.dataset.pcat;

  var mc = getMeatCount({name:productName});

  }

  var details = [];
  if (pendingExtras.meats.length) details.push('Viandes: '+pendingExtras.meats.join(', '));
  if (pendingExtras.sauces.length) details.push('Sauce: '+pendingExtras.sauces.join(', '));
  if (pendingExtras.crudites.length) details.push('Crudites: '+pendingExtras.crudites.join(', '));
  if (pendingExtras.supplements && pendingExtras.supplements.length) {
    details.push('Suppl: '+pendingExtras.supplements.join(', ')+' (+'+fmt(pendingExtras.supplements.length*SUPPLEMENT_PRICE)+')');
  }
  var noteEl = document.getElementById('prod-note');
  if (noteEl && noteEl.value.trim()) details.push('Note: '+noteEl.value.trim());

  var suppCost = (pendingExtras.supplements||[]).length * SUPPLEMENT_PRICE;

  closeModal('m-product');
  cart.push({
    id: genId(),
    pid: pid,
    name: productName,
    price: suppCost, // Only supplements are paid
    cat: cat,
    details: details.join(' | '),
    qty: 1,
    isReward: true,
    rewardPalier: palierName
  });
  pendingExtras = {meats:[], sauces:[], crudites:[], supplements:[]};
  updateBadges();

// Ecoute des alertes "client sur place" pour les comptes cote stand
function attachAdminNotifListener(user) {
  if (!user) return;
  console.log('[Notif] Listener ADMIN attache pour:', user.prenom);
  db.ref('status_updates/'+user.id).off();
  db.ref('status_updates/'+user.id).on('child_added', function(snap) {
    var update = snap.val();
    if (!update) { snap.ref.remove(); return; }
    if (update.status === 'client_present') {
      // Ignorer les alertes trop anciennes (evite une salve au demarrage)
      var fresh = true;
      try { fresh = !update.at || (new Date() - new Date(update.at)) < 600000; } catch(e) {}
      if (fresh) showClientPresentAlert(update);
    }
    snap.ref.remove();
  });
}

function attachClientNotifListener(user) {
  if (!user || !user.id) return;
  var isAdmin = user.role==='superadmin'||user.role==='admin'||user.role==='entreprise'||user.role==='preparateur';
  // Comptes cote stand : ecoute dediee (alerte sonore "client sur place")
  if (isAdmin) { attachAdminNotifListener(user); return; }
  console.log('[Notif] Attaching listener for user:', user.id);
  var sessionStart = new Date().toISOString();
  // Remove old listener first
  db.ref('status_updates/'+user.id).off();
  // Attach new listener
  db.ref('status_updates/'+user.id).on('child_added', function(snap) {
    var update = snap.val();
    if (!update || !update.at) { snap.ref.remove(); return; }
    console.log('[Notif] Received update:', update.status, update.title);
    // Show all updates regardless of age when app is open
    if (update.status === 'ready') {
      showOrderReadyAlert({orderNumber: update.orderNumber, id: update.orderId});
      sendPushNotif(update.title, update.body);
    } else if (update.status === 'confirmed' || update.status === 'preparing') {
      toast('📦 '+update.title+' — '+update.body, 'info', 7000);
      sendPushNotif(update.title, update.body);
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    } else if (update.status === 'picked_up') {
      toast('✅ '+update.body, 'success', 5000);
    } else {
      // Message / offre / relance
      toast('📣 '+update.title+' : '+update.body, 'info', 8000);
      sendPushNotif(update.title, update.body);
      if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
    }
    snap.ref.remove();
  });
}

function startCountdown() {
  setInterval(function(){
    var el = document.getElementById('countdown');
    if (!el) return;
    var cfg = getCfg();
    var now = new Date();
    var cp = cfg.cutoff.split(':');
    var cutoff = new Date(); cutoff.setHours(+cp[0],+cp[1],0,0);
    var ms = cutoff - now;
    if (ms <= 0) {
      // Commandes fermees - refresh home
      if (currentScreen === 'home') renderHome();
      return;
    }
    var h = Math.floor(ms/3600000);
    var m = Math.floor((ms%3600000)/60000);
    var s = Math.floor((ms%60000)/1000);
    el.textContent = h>0 ? h+'h'+String(m).padStart(2,'0')+'min' : m>0 ? m+'min '+String(s).padStart(2,'0')+'s' : s+'s';
  }, 1000);
}
